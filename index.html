function rollCons() {
  const out = [];
  for (let k = 0; k < 2; k++) {
    let pool;
    const r = Math.random();
    if (r < 0.45) pool = QIAN.map(q => q.id);
    else if (r < 0.8) pool = PU_MELD.map(p => p.id);
    else pool = PU_FAN.map(p => p.id);
    pool = pool.filter(id => !out.includes(id));
    out.push(pool[rnd(pool.length)]);
  }
  return out;
}
function buyCons(id, btn) {
  const c = CONSUMABLE[id];
  if (!c || !(G.shopCons || []).includes(id)) return;
  if (G.money < c.price || (c.type === 'qian' && (G.cons || []).length >= consSlots())) { shake(btn); SFX.buzz(); return; }
  G.money -= c.price; G.shopCons = G.shopCons.filter(x => x !== id);
  if (c.type === 'pu') {
    if (c.lv) { G.lv[c.lv] = (G.lv[c.lv] || 0) + 1; toast(`${c.name}`, `${MELD_CN[c.lv]}升到 Lv.${G.lv[c.lv] + 1}`); }
    else { G.fanLv[c.fan] = (G.fanLv[c.fan] || 0) + 1; toast(`${c.name}`, `${FAN[c.fan].name}升到 Lv.${G.fanLv[c.fan] + 1}`); }
  } else { G.cons = (G.cons || []).concat([id]); }
  save(); render(); SFX.coin(); if (c.type === 'pu') { grow('tidui', 1); save(); }
  restart(document.getElementById('money'), 'flash', 600);
}
function openShop() {
  G.reroll = 2;

  G.shop = rollOffers();
  G.screen = 'shop';
  save(); render(); SFX.whoosh();
}
// shop odds by round: [white, blue, gold]
const RARITY_ODDS = [[85, 15, 0], [70, 27, 3], [58, 34, 8], [48, 39, 13], [40, 42, 18], [32, 45, 23]];
function rarityOdds() { return RARITY_ODDS[Math.min(RARITY_ODDS.length - 1, Math.max(0, (G.round || 1) - 1))]; }
function rollOffers() {
  const odds = rarityOdds(), keys = ['white', 'blue', 'gold'], out = [];
  for (let k = 0; k < shopSlots(); k++) {
    let roll = gr() * 100, r = 'white';
    for (let i = 0; i < 3; i++) { if (roll < odds[i]) { r = keys[i]; break; } roll -= odds[i]; }
    let pool = TREASURES.filter(t => t.r === r && !G.treasures.includes(t.id) && !out.includes(t.id));
    if (!pool.length) pool = TREASURES.filter(t => !G.treasures.includes(t.id) && !out.includes(t.id));
    if (pool.length) out.push(pool[rnd(pool.length)].id);
  }
  return out;
}
function buy(id, btn) {
  const p = priceOf(id);
  if (G.money < p || G.treasures.length >= maxSlots() || !G.shop.includes(id)) { shake(btn); SFX.buzz(); return; }
  G.money -= p; G.treasures.push(id); G.shop = G.shop.filter(x => x !== id);
  if (TREASURE[id].grow) { G.ts = G.ts || {}; G.ts[id] = TREASURE[id].init || 0; }
  save(); render(); SFX.coin();
  const slot = app.querySelector(`.slot[data-id="${id}"]`); restart(slot, 'landed', 700);
  restart(document.getElementById('money'), 'flash', 600);
}
function sell(id) {
  if (!G.treasures.includes(id)) return;
  G.money += Math.floor(TREASURE[id].price / 2) + (id === 'dangpiao' ? ((G.ts || {}).dangpiao || 0) : 0);
  G.treasures = G.treasures.filter(x => x !== id);
  ui.info = null; save(); render(); SFX.coin();
  restart(document.getElementById('money'), 'flash', 600);
}
function reroll(btn) {
  if (G.money < G.reroll) { shake(btn); SFX.buzz(); return; }
  G.money -= G.reroll; G.reroll++;
  G.shop = rollOffers(); G.shopCons = rollCons(); save(); render(); SFX.whoosh();
  app.querySelectorAll('.offer').forEach(el => restart(el, 'deal', 700));
  restart(document.getElementById('money'), 'flash', 600);
}

function recommended() {
  const m = G.m;
  const key = m.hand.map(x => x.id + ':' + x.t).join(',') + '|' + m.exposed.length + '|' + m.river.length;

    for (let t = 0; t < 27; t++) { if (seen[t] >= 4) continue; c[t]++; if (shanten(c, n) < s0) uke += 4 - seen[t]; c[t]--; }
    cand.push({ t: x.t, s0, uke });
  }
  const bestS = Math.min(...cand.map(o => o.s0));
  const top = cand.filter(o => o.s0 === bestS);
  const bestU = Math.max(...top.map(o => o.uke));

// put the seated figures BEHIND the far edge of the (perspective) table, heads always above it
function layoutSeats() {
  const ar = app.querySelector('.arena'); if (!ar) return;
  const L = ar.querySelector('.mk-l'), R = ar.querySelector('.mk-r'); if (!L || !R) return;
  const probe = ar.querySelector('.tprobe');
  const t = (probe && probe.getBoundingClientRect().width) || 20;
  const figH = t * 6.6, sideH = t * 8.6;
  const ML = ar.querySelector('.mk-ml'), MR = ar.querySelector('.mk-mr');
  for (let pass = 0; pass < 2; pass++) {
    const ra = ar.getBoundingClientRect(), rl = L.getBoundingClientRect(), rr = R.getBoundingClientRect();
    const farY = (rl.top + rr.top) / 2 - ra.top;
    const need = figH * 0.74 + t * 0.3;
    if (pass === 0 && farY < need) { const pt = parseFloat(getComputedStyle(ar).paddingTop) || 0; ar.style.paddingTop = (pt + need - farY) + 'px'; continue; }
    ar.style.setProperty('--farY', farY + 'px');
    ar.style.setProperty('--farL', (rl.left - ra.left) + 'px');
    ar.style.setProperty('--farR', (ra.right - rr.right) + 'px');
    ar.style.setProperty('--figH', figH + 'px');
    ar.style.setProperty('--sideH', sideH + 'px');
    if (ML && MR) {
      const rml = ML.getBoundingClientRect(), rmr = MR.getBoundingClientRect();
      ar.style.setProperty('--sideLX', (rml.left - ra.left) + 'px');
      ar.style.setProperty('--sideRX', (ra.right - rmr.right) + 'px');
      ar.style.setProperty('--sideY', ((rml.top + rmr.top) / 2 - ra.top) + 'px');
    }
    ar.classList.add('laid');
    break;
  }
}

// =====================================================================
// 核心玩法 v2（v33 起）：亮牌计分
// 每场：手里 11 张牌，4 次亮牌、3 次弃牌。每次挑 1–6 张亮出来，立刻按牌型计分：
//   (牌型底分 + 每张牌的点数 + 珍玩加的筹码) × (牌型番数 + 番种 + 珍玩加的番) × 珍玩的倍数
// 四次亮牌里凑够 4 组面子 + 1 对雀头 = 胡牌，这一场的总分翻倍。
// 本文件放在 app.js 后面：同名函数会覆盖旧的（旧的麻将对局代码保留不用）。
// =====================================================================
const HAND_SIZE = 11, BASE_PLAYS = 4, BASE_SWAPS2 = 3, MAX_PICK = 6, MAX_SWAP_PICK = 6;
const BASE_TARGET2 = [300, 650, 1400, 3000, 6500, 13000];
function targetFor(round, idx) { return Math.round(BASE_TARGET2[round - 1] * [1, 1.5, 2][idx] / 10) * 10; }

// ---------- 牌型 ----------
const PTYPES = [
  { id: 'high', name: '单张', c: 10, f: 1, lc: 10, lf: 1, desc: '随便一张牌，只算点数最大的那张' },
  { id: 'pair', name: '对子', c: 20, f: 2, lc: 15, lf: 1, desc: '两张一样的牌' },
  { id: 'twopair', name: '双对', c: 35, f: 2, lc: 20, lf: 1, desc: '两个对子（4 张）' },
  { id: 'chow', name: '顺子', c: 40, f: 3, lc: 20, lf: 1, desc: '同花色连着的三张，如 三四五万' },
  { id: 'pung', name: '刻子', c: 50, f: 3, lc: 40, lf: 2, desc: '三张一样的牌' },
  { id: 'meldpair', name: '面子带雀头', c: 60, f: 4, lc: 30, lf: 2, desc: '一组顺子或刻子，加一个对子（5 张）' },
  { id: 'kong', name: '杠', c: 100, f: 6, lc: 50, lf: 3, desc: '四张一样的牌' },
  { id: 'twomeld', name: '两组面子', c: 90, f: 4, lc: 35, lf: 2, desc: '两组顺子或刻子（6 张）' },
];
const PT = Object.fromEntries(PTYPES.map(p => [p.id, p]));
// 番种标签（亮牌时额外加番）
const PTAGS = [
  { id: 'duanyao', name: '断幺', f: 1, lf: 1, desc: '计分的牌里没有一和九（至少 3 张）' },
  { id: 'yaojiu', name: '幺九', f: 3, lf: 2, desc: '计分的牌全是一或九（至少 2 张）' },
  { id: 'qingyise', name: '清一色', f: 3, lf: 2, desc: '计分的牌全是同一花色（至少 5 张）' },
  { id: 'sanse', name: '三色同顺', f: 6, lf: 3, desc: '两组顺子数字一样、花色不同' },
  { id: 'yitiao', name: '连顺', f: 8, lf: 3, desc: '同花色两组顺子首尾相接，如 123+456' },
];
const PTAG = Object.fromEntries(PTAGS.map(p => [p.id, p]));

// 从选中的牌里找出得分最高的牌型。返回 {type, scoring:[tile], melds:[{k,t}], pairs:n, tags:[]}
function classifyPlay(tiles) {
  const vis = tiles.slice();
  const n = vis.length;
  if (!n) return null;
  const byT = {}; vis.forEach(x => (byT[x.t] = byT[x.t] || []).push(x));
  const types = Object.keys(byT).map(Number).sort((a, b) => a - b);
  const cands = [];
  const take = (pool, ts) => { const p = Object.fromEntries(Object.entries(pool).map(([k, v]) => [k, v.slice()])); const out = []; for (const t of ts) { if (!p[t] || !p[t].length) return null; out.push(p[t].shift()); } return { p, out }; };
  // 所有可能的“面子”
  const meldOpts = pool => {
    const res = [];
    for (const t of Object.keys(pool).map(Number)) {
      if (pool[t].length >= 3) res.push({ k: 'pung', t, ts: [t, t, t] });
      if (rankOf(t) <= 7 && pool[t].length && pool[t + 1] && pool[t + 1].length && pool[t + 2] && pool[t + 2].length && suitOf(t) === suitOf(t + 2)) res.push({ k: 'chow', t, ts: [t, t + 1, t + 2] });
    }
    return res;
  };
  const pairOpts = pool => Object.keys(pool).map(Number).filter(t => pool[t].length >= 2);
  const add = (type, scoring, melds, pairs) => cands.push({ type, scoring, melds, pairs });
  // 杠
  for (const t of types) if (byT[t].length >= 4) add('kong', byT[t].slice(0, 4), [{ k: 'kong', t }], 0);
  // 两组面子 / 面子带雀头 / 单组面子
  for (const m1 of meldOpts(byT)) {
    const r1 = take(byT, m1.ts); if (!r1) continue;
    add(m1.k, r1.out, [{ k: m1.k, t: m1.t }], 0);
    for (const m2 of meldOpts(r1.p)) { const r2 = take(r1.p, m2.ts); if (r2) add('twomeld', r1.out.concat(r2.out), [{ k: m1.k, t: m1.t }, { k: m2.k, t: m2.t }], 0); }
    for (const pt of pairOpts(r1.p)) { const r2 = take(r1.p, [pt, pt]); if (r2) add('meldpair', r1.out.concat(r2.out), [{ k: m1.k, t: m1.t }], 1); }
  }
  // 对子 / 双对
  const ps = types.filter(t => byT[t].length >= 2);
  for (const a of ps) { add('pair', byT[a].slice(0, 2), [], 1); for (const b of ps) if (b > a) add('twopair', byT[a].slice(0, 2).concat(byT[b].slice(0, 2)), [], 2); }
  // 单张：点数最大的那张
  const hi = vis.slice().sort((a, b) => rankOf(b.t) - rankOf(a.t))[0];
  add('high', [hi], [], 0);
  // 按 (底筹码+点数) × 底番 粗估选最好的
  let best = null, bv = -1;
  for (const c of cands) {
    const p = PT[c.type], pts = c.scoring.reduce((a, x) => a + rankOf(x.t), 0);
    const tags = playTags(c);
    const v = (p.c + pts) * (p.f + tags.reduce((a, g) => a + PTAG[g].f, 0));
    if (v > bv) { bv = v; best = Object.assign(c, { tags }); }
  }
  return best;
}
function playTags(c) {
  const s = c.scoring, out = [];
  if (s.length >= 3 && s.every(x => !isTerm(x.t))) out.push('duanyao');
  if (s.length >= 2 && s.every(x => isTerm(x.t))) out.push('yaojiu');
  if (s.length >= 5 && s.every(x => suitOf(x.t) === suitOf(s[0].t))) out.push('qingyise');
  if (c.type === 'twomeld' && c.melds.every(m => m.k === 'chow')) {
    const [a, b] = c.melds;
    if (rankOf(a.t) === rankOf(b.t) && suitOf(a.t) !== suitOf(b.t)) out.push('sanse');
    if (suitOf(a.t) === suitOf(b.t) && Math.abs(a.t - b.t) === 3) out.push('yitiao');
  }
  return out;
}

// 2.16 成长类珍玩每次涨多少（数值平衡见 数值/2.16_数值平衡.md）
const GROW = { huaming: 2.5, jixue: 30, hongdou: 0.4, fenglu: 4, xiangling: 0.25, shishe: 0.7, yaling: 0.5, luohong: 2, sishan: 1, yeyan: 0.1, tidui: 0.1 };

// Cc：珍玩触发时反馈太小、算分太快看不清；反馈要从小到大分档，后期倍数暴涨时要爆炸式。
// 做法：
//  1. 每件珍玩触发时，牌桌上方弹出一张大的「触发卡」：珍玩大图 + 名字 + 加了多少（蓝 +筹码 / 红 +番 / 红底 ×番），
//     同时顶上那一排里的这件珍玩跳一下。
//  2. 每一步都按「这一下有多大」分四档（小 / 中 / 高 / 超高）：卡片大小、字号、声音、震屏、火花一档比一档大。

{

    <div class="pscore score2 ${full ? 'full' : ''}"${tip('四个人同场比分。你的分到过关线、又比三家都高，立刻过关；到不了也没关系，亮牌用完时比三家都高照样过关。')}>
      <div class="ps1"><small>你</small><b id="bankv" data-sep="1">${num(m.score)}</b>${m.paidOut ? `<i class="tup">点炮 −${num(m.paidOut)}</i>` : ''}<span class="grow"></span><small>过关线</small><b class="pline ${m.score >= lineOf() ? 'ok' : ''}">${num(lineOf())}</b></div>
      <div class="pbar"><i style="width:${pct}%"></i><em style="left:${opct}%"></em></div>
      <div class="ps3"><span>最高的对手 <b class="popp-top">${esc(seatName(oppLeader()))} ${num(oppMax())}</b></span><span class="grow"></span><span class="pips pipP ${m.plays <= 1 ? 'low' : ''}">亮牌 ${pipsHTML(m.plays)}</span><span class="pips pipS">弃牌 ${pipsHTML(m.swapsLeft)}</span></div>
    </div>
    <div class="prelic">${shelfHTML()}<i class="psep"></i>${consBarHTML()}</div>
  </header>`;
}
sideHTML = (orig => function () { return phoneSync() ? phoneTopHTML() : orig.apply(this, arguments); })(sideHTML);

// ---- 牌桌：技能小条 ----
tableHTML = (orig => function () {
  const h = orig.apply(this, arguments);
  if (!PHONE_ON) return h;
  const c = charById(G.char);
  return h.replace('<i class="tprobe"></i>', `<i class="tprobe"></i><button class="pskill" data-act="skill-info"${tip(`${c.name}的本事「${c.skill}」：${c.desc}`)}>${esc(c.skill)}</button>`);
})(tableHTML);

// ---- 手牌两排；菜单、对手说明卡 ----
viewMatch = (orig => function () {
  let h = orig.apply(this, arguments);
  if (!PHONE_ON || !G || !G.m) return h;
  const n = G.m.hand.length, cols = Math.max(4, Math.ceil(n / 2));
  h = h.replace('<div class="hand">', `<div class="hand" style="--cols:${cols}">`);
  if (ui.pmenu) h += pmenuHTML();
  if (ui.oppInfo != null) h += oppInfoHTML(ui.oppInfo);
  if (ui.skillInfo) h += skillInfoHTML();
  return h;
})(viewMatch);

function sheetHTML(inner, close) {
  return `<div class="ov psheetov" data-act="${close}" role="dialog"><div class="psheet" data-act="sheet-stay"><i class="pgrab"></i>${inner}</div></div>`;
}
function pmenuHTML() {
  return sheetHTML(`<h3 class="psh">菜单</h3>
    <div class="pmenulist">
      <button class="btn" data-act="codex" data-id="fans">牌型表</button>
      <button class="btn" data-act="codex" data-id="treasures">图鉴</button>
      <button class="btn" data-act="rules">玩法说明</button>
      <button class="btn" data-act="achv">成就</button>
      <div class="pmute">${muteBtn()}</div>
      <button class="btn ghost" data-act="home">回到标题（存档留着）</button>
    </div>
    <button class="btn red pclose" data-act="pmenu-close">关闭</button>`, 'pmenu-close');
}
function oppInfoHTML(i) {
  const m = G.m, o = m.opp[i], boss = i === 1 && m.boss, id = seatImgId(i), nm = esc(seatName(i));
  const tp = oppTenpai(o);
  return sheetHTML(`<div class="poh">
      <span class="pohimg">${SEAT_OK[id] ? `<img src="${seatSrc(id)}" alt="">` : `<span class="scglyph">${seatGlyph(i)}</span>`}</span>
      <span class="pohtx"><small>${boss ? '本场坐庄' : SEATS[i].pos}</small><b>${nm}</b><span class="pohsc">${fmt(o.score)} <small>分</small>${o.hu ? ' <em>已胡</em>' : ''}</span></span>
    </div>
    ${boss ? `<p class="pgame"><b>坐庄规则：</b>${kw(bossById(m.boss).rule)}</p>` : ''}
    <p class="pgame">在凑 <b class="s${o.fav}">${SUITS[o.fav]}</b> 子${i === 0 ? '，还<b>能吃</b>（只有下家能吃）' : ''}。你弃掉的牌，她手里有一对就会<b>碰</b>走${i === 0 ? '，有两张能连成顺子也会吃走' : ''}，拿去得分，你还要付她一半。</p>
    ${tp ? `<p class="pgame pwarn"><b>听牌了：</b>再来一张就胡。你弃的牌正好是她等的那张，就是点炮胡——她分数翻倍，你还要付她这组分数的全额。</p>` : ''}
    ${(o.river || []).length ? `<div class="porow"><small>弃过的牌</small><span>${o.river.slice(-10).map(smallTile).join('')}</span></div>` : ''}
    ${o.melds.length ? `<div class="porow"><small>亮出的面子</small><span>${o.melds.map(g => `<span class="pomeld">${g.map(smallTile).join('')}</span>`).join('')}</span></div>` : ''}
    ${o.paid ? `<p class="pgame">你点炮付给她 <b>${o.paid}</b> 分。</p>` : ''}
    <button class="btn red pclose" data-act="opp-close">知道了</button>`, 'opp-close');
}
function skillInfoHTML() {
  const c = charById(G.char);
  return sheetHTML(`<div class="poh"><span class="pohimg round"><img src="${imgSrc(c.id)}" alt=""></span><span class="pohtx"><small>你的人物</small><b>${esc(c.name)}</b><span class="pohsc gold">${esc(c.skill)}</span></span></div>
    <p class="pgame big">${kw(c.desc)}</p>
    <button class="btn red pclose" data-act="skill-close">知道了</button>`, 'skill-close');
}

CORE2_ACT = (orig => function (a, b, id) {
  switch (a) {
    case 'pmenu': ui.pmenu = true; SFX.select(); render(); return true;
    case 'pmenu-close': ui.pmenu = false; render(); return true;
    case 'opp-info': ui.oppInfo = id; SFX.select(); render(); return true;
    case 'opp-close': ui.oppInfo = null; render(); return true;
    case 'skill-info': if (!PHONE_ON) return true; ui.skillInfo = true; SFX.select(); render(); return true;
    case 'skill-close': ui.skillInfo = false; render(); return true;
    case 'sheet-stay': return true;
  }
  if (ui.pmenu && ['codex', 'rules', 'home'].includes(a)) ui.pmenu = false;
  return orig.apply(this, arguments);
})(CORE2_ACT);

// ---- 三家出牌的跳字：手机上从顶上那一排头像冒出来 ----
async function oppTurn() {
  const m = G.m;
  const ev = oppRound();
  save(); render();
  for (const e of ev) {
    const card = app.querySelector(PHONE_ON ? `.pchip[data-seat="${e.i}"]` : `.scard.${SEAT_POS[e.i]}`);
    if (card) { jig(card); popAt(card, e.kind === '胡' ? `胡了！×2` : `+${e.v}`, e.kind === '胡' ? 'gold' : 'red'); }
    if (e.kind === '胡') { stamp(`${seatName(e.i).slice(-2)}胡了`, 'red'); SFX.fanfare(); bigShake(); toast(`${seatName(e.i)}胡牌了`, '她这一场的分数翻倍。'); await sleep(900); }
    else { SFX.tick(4); await sleep(ui.fast ? 60 : 260); }
  }
}
function animateScore(from, to) {
  const el = app.querySelector('#bankv'); if (!el) return;
  countTo(el, from, to, 600);
  const w = Math.min(100, to / Math.max(1, oppMax() + 1, lineOf()) * 100) + '%';
  const bar = app.querySelector('.score2 .bar i, .pscore .pbar i'); if (bar) bar.style.width = w;
}

// ---- 牌桌按剩下的空间整体缩放（屏幕矮时只缩这一块） ----
function fitTable() {
  const a = app.querySelector('.arena'), p = a && a.querySelector('.persp');
  if (!a || !p) return;
  p.style.transform = 'none';
  const ar = a.getBoundingClientRect(), pr = p.getBoundingClientRect();
  if (!pr.height || !ar.height) return;
  const s = Math.max(0.35, Math.min(1.3, (ar.height - 8) / pr.height, (ar.width - 6) / pr.width));
  p.style.transform = `scale(${s.toFixed(3)})`;
  const pp = a.querySelector('.playpane');
  if (pp && pp.offsetHeight) a.style.setProperty('--pps', Math.max(0.4, Math.min(0.88, (ar.height - 12) / (pp.offsetHeight + 56), (ar.width - 16) / pp.offsetWidth)).toFixed(3));
}
startMatch = (orig => function () { ui.pmenu = false; ui.oppInfo = null; ui.skillInfo = false; return orig.apply(this, arguments); })(startMatch);
layoutSeats = (orig => function () { const r = orig.apply(this, arguments); if (PHONE_ON) fitTable(); return r; })(layoutSeats);

// ---- 命运卡：剧情收进「展开故事」 ----
fateStageHTML = (orig => function (st, n) {
  if (!PHONE_ON) return orig.apply(this, arguments);
  return `<div class="fseg turn"><small>这一回她的命运改变</small><p>${esc(st.change)}</p></div>
    <details class="pstory"><summary>展开故事 · 原书${esc(st.src)}</summary>
      <div class="fseg set"><small>第 ${n} 阶段 · 阶段设定</small><p>${esc(st.setting)}</p></div>
      <div class="fseg quote"><small>原书 · ${esc(st.src)}</small><p class="fq">“${esc(st.quote)}”</p><p class="fqx">${esc(st.explain)}</p></div>
    </details>`;
})(fateStageHTML);

// ---- 手机上点按钮时浏览器会模拟「悬停」，别让悬停提示乱跳；手机只在点到带说明的字时才出提示 ----
document.addEventListener('mouseover', e => { if (PHONE_ON) e.stopImmediatePropagation(); }, true);


// ---- 2.25 集市：手机上一屏放下（不滚动） ----
function phoneShopHTML() {
  const nextKind = KINDS[G.idx];
  const nb = nextKind.id === 'boss' ? bossById(G.bosses[G.round - 1]) : null;
  const y = G.ying && YZ[G.ying];
  const odds = rarityOdds();
  const tre = (G.shop || []).map(id => `<div class="offer">${treasureCard(TREASURE[id], 'shop')}</div>`).join('') || '<p class="small pempty">货架空了，可以刷新。</p>';
  const cons = (G.shopCons || []).map(id => `<div class="offer">${consCard(CONSUMABLE[id], 'shop')}</div>`).join('');
  const ying = y ? `<div class="offer"><div class="tcard ying shop"><div class="tban"><span>${esc(y.name)}</span></div><div class="tframe"><div class="tslot"><span class="tglyph">营</span></div></div><div class="tkind">营造 · 永久</div><p class="teff">${kw(y.desc)}</p><button class="btn ${G.money >= YZ_PRICE ? 'red' : ''}" data-act="buy-ying" ${dis(G.money >= YZ_PRICE)}>盖 $${YZ_PRICE}</button></div></div>` : '';
  const nMini = (G.shopCons || []).length + (y ? 1 : 0);
  return `<div class="pshop">
    <header class="ptop">
      <div class="pbar1">
        <button class="pmenu" data-act="pmenu" aria-label="菜单"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="pttl"><b>集市</b><small>下一场：${G.round > ROUNDS ? '无尽 · ' : ''}第${CN[G.round] || G.round}回 ${nextKind.name} · 过关线 ${num(passLine(G.round, G.idx))}${nb ? ` · ${esc(nb.name)}坐庄` : ''}</small></div>
        <span class="plamps">${lampsHTML()}</span>
        <span class="pmoney"${tip(interestText())}><b id="money">${G.money}</b><small> +$${interest()}</small></span>
      </div>
      ${nb ? `<div class="pboss"><b>${esc(nb.name)}坐庄</b>${kw(nb.rule)}</div>` : ''}
      <div class="prelic">${shelfHTML()}<i class="psep"></i>${consBarHTML()}</div>
    </header>
    <div class="poffers">
    <div class="psec"><b>珍玩</b><small>白 ${odds[0]}% · 蓝 ${odds[1]}% · 金 ${odds[2]}% · 点自己的珍玩能看说明、卖掉</small></div>
    <div class="offers pbig" style="--n:${Math.max(3, (G.shop || []).length)}">${tre}</div>
    ${nMini ? `<div class="psec"><b>签 · 谱 · 营造</b><small>签最多带 ${consSlots()} 张；谱买下就读；营造每回一处</small></div>
    <div class="offers consoffers pmini" style="--n:${Math.max(3, nMini)}">${cons}${ying}</div>` : ''}
    </div>
    <div class="pshopbar">
      <button class="btn" data-act="codex" data-id="treasures">图鉴</button>
      <button class="btn"${tip('刷新货架：重新随机摆珍玩和签谱。每刷一次价格 +$1，下一场重置。')} data-act="reroll" ${dis(G.money >= G.reroll)}>刷新 $${G.reroll}</button>
      <button class="btn red" data-act="next-match">下一场</button>
    </div>
  </div>
  ${ui.pmenu ? pmenuHTML() : ''}`;
}
viewShop = (orig => function () { return phoneSync() ? phoneShopHTML() : orig.apply(this, arguments); })(viewShop);


// ---- 2.25 选人：手机上横着滑，停在哪张就选哪张 ----
viewSelect = (orig => function () {
  const h = orig.apply(this, arguments);
  if (!phoneSync()) return h;
  return h.replace('<div class="row center">', `<div class="cdots">${CHARACTERS.map(c => `<i data-id="${c.id}" class="${ui.pickChar === c.id ? 'on' : ''}"></i>`).join('')}</div><div class="row center">`);
})(viewSelect);
function selSnap() {
  const row = app.querySelector('#app[data-screen=select] .chars, .chars'); if (!row || app.dataset.screen !== 'select' || !PHONE_ON) return;
  const mid = row.getBoundingClientRect().left + row.clientWidth / 2;
  let best = null, bd = 1e9;
  row.querySelectorAll('.ccard').forEach(c => { const r = c.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - mid); if (d < bd) { bd = d; best = c; } });
  if (!best) return;
  const id = best.dataset.id;
  app.querySelectorAll('.cdots i').forEach(i => i.classList.toggle('on', i.dataset.id === id));
  if (best.classList.contains('locked')) return;
  if (ui.pickChar !== id) {
    ui.pickChar = id;
    row.querySelectorAll('.ccard').forEach(c => c.classList.toggle('on', c === best));
    const st = app.querySelector('[data-act="start"]'); if (st) { st.removeAttribute('aria-disabled'); st.disabled = false; st.classList.remove('dis'); }
  }
}
document.addEventListener('scroll', e => { if (e.target && e.target.classList && e.target.classList.contains('chars')) { clearTimeout(selSnap.t); selSnap.t = setTimeout(selSnap, 90); } }, true);
layoutSeats = layoutSeats; // (占位：选人页不需要)
render = (orig => function () {
  const r = orig.apply(this, arguments);
  if (PHONE_ON && app.dataset.screen === 'select') {
    const row = app.querySelector('.chars'), on = row && (row.querySelector('.ccard.on') || null);
    if (row && on && !selSnap.restoring) { selSnap.restoring = true; row.scrollLeft = on.offsetLeft - (row.clientWidth - on.clientWidth) / 2; requestAnimationFrame(() => { selSnap.restoring = false; }); }
  }
  return r;
})(render);

// ---- 每次重画前先判断是不是手机竖屏；转屏、改窗口大小时重画 ----
render = (orig => function () { phoneSync(); const r = orig.apply(this, arguments); if (PHONE_ON && app.dataset.screen === 'shop') fitShop(); return r; })(render);
// 集市货多、屏幕矮时，货架整体缩小到放得下（不出现滚动）
function fitShop() {
  const el = app.querySelector('.poffers'); if (!el) return;
  el.style.zoom = 1;
  const need = el.scrollHeight, have = el.clientHeight;
  if (need > have + 1) el.style.zoom = Math.max(0.6, have / need).toFixed(3);
}
window.addEventListener('resize', () => {
  const was = PHONE_ON;
  if (phoneSync() !== was && !ui.busy) render();
  else if (PHONE_ON && G && G.screen === 'match' && screen === 'run') fitTable();
});
phoneSync();
if (G && screen === 'run' && !ui.busy) { try { render(); } catch (e) { console.error(e); } }

</script>

</body></html>
