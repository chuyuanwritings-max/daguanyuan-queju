<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="大观园雀局"><meta name="theme-color" content="#0f0b08">
<title>大观园雀局</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: one centered column, 90s cel-anime night sky behind; ink panels and ivory tiles on top. Single dark look by design. */
:root{
  --night:#0c1630; --sky:#1d3a6c; --sky-hi:#3d6eab; --cloud:#ece7ef; --cloud-sh:#9ea6c6;
  --teal:#21403b; --teal-sh:#152d29; --ivory:#f1e5ca; --ivory-sh:#d6c095; --ink:#17110f;
  --crimson:#b3352c; --gold:#d4a84d; --lilac:#9c90c6; --jade:#2f7a58; --tile-blue:#24468c;
  --text:#f4ede0; --muted:#b9b5cb; --panel:rgba(9,13,27,.66); --sub:rgba(0,0,0,.58);
  --f-brush:'Ma Shan Zheng','STKaiti','KaiTi',serif;
  --f-serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --f-sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-sans);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sky + film */
.sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--night) 0%,var(--sky) 55%,var(--sky-hi) 100%);overflow:hidden}
.sky svg{position:absolute;width:140%;left:-20%;bottom:-6%;opacity:.9}
.film{position:fixed;inset:0;z-index:50;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay}
.film::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)}

#app{position:relative;z-index:1;max-width:760px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;
  display:flex;flex-direction:column;gap:12px}

/* subtitle bar, the signature device */
.sub{background:var(--sub);color:#fff;text-align:center;padding:.45em 1.4em .5em;display:inline-flex;flex-direction:column;align-items:center;gap:.05em;font-weight:500;letter-spacing:.02em}
.sub .zh{font-size:1.15em}
.sub .en{font-size:.92em;opacity:.92;font-family:var(--f-sans)}
.subwrap{display:flex;justify-content:center}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--ivory);color:var(--ink);font-weight:700;padding:.6em 1.2em;border-radius:4px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--crimson);color:#fff}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--muted);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}

/* title */
.title-art{position:relative;border:3px solid var(--ink);overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--sky)}
.title-art svg{position:absolute;inset:0;width:100%;height:100%}
.title-art .logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.logo h1{margin:0;font-family:var(--f-brush);font-weight:400;font-size:clamp(52px,13vw,104px);line-height:1;color:var(--ivory);
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--crimson),6px 6px 0 var(--ink)}
.title-art .subwrap{position:absolute;left:0;right:0;bottom:7%}
.lede{color:var(--muted);text-align:center;margin:0;max-width:34em;align-self:center}

/* character select */
.h2{font-family:var(--f-serif);font-weight:900;font-size:22px;margin:4px 0 0;text-align:center;letter-spacing:.08em}
.chars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ccard{border:3px solid var(--ink);background:var(--panel);text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--ink)}
.ccard.on{outline:3px solid var(--gold);outline-offset:2px}
.ccard .art{position:relative;aspect-ratio:4/3;overflow:hidden}
.ccard .art svg{position:absolute;inset:0;width:100%;height:100%}
.ccard .art .subwrap{position:absolute;left:0;right:0;bottom:8px}
.ccard .art.portrait{aspect-ratio:3/4}
.ccard .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ccard .art .sub{font-size:12px;padding:.3em 1em .35em}
.ccard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.skill{font-family:var(--f-serif);font-weight:900;color:var(--gold);letter-spacing:.1em}
.ccard p{margin:0;font-size:13.5px;color:var(--text)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:2px solid var(--ink);padding:8px 12px}
.hud b{font-variant-numeric:tabular-nums}
.hud .stage{font-family:var(--f-serif);font-weight:900;letter-spacing:.06em}
.hud .grow{flex:1}
.lamps{letter-spacing:2px;color:var(--gold)}
.lamps .off{color:#4b4f63}
.chip{font-size:12px;border:1px solid var(--muted);padding:1px 8px;border-radius:99px;color:var(--muted)}
.chip.boss{border-color:var(--crimson);color:#ffb4a8}
.meter{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.meter b{color:var(--text)}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{min-height:46px;border:2px dashed rgba(185,181,203,.35);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);padding:4px;text-align:center;background:transparent}
.slot.full{border:2px solid var(--ink);background:var(--ivory);color:var(--ink);font-family:var(--f-serif);font-weight:900;font-size:13px;box-shadow:2px 2px 0 var(--ink)}

/* table */
.table{position:relative;background:var(--teal);border:3px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.table::before{content:"";position:absolute;right:-30%;top:-40%;width:80%;height:180%;background:var(--teal-sh);transform:rotate(18deg);z-index:0}
.table>*{position:relative;z-index:1}
.label{font-size:12px;color:var(--muted);letter-spacing:.12em}
.river,.kongs{display:flex;flex-wrap:wrap;gap:3px;min-height:20px}
.kongs .grp{display:flex;gap:1px;padding:2px;border:1px solid var(--gold);border-radius:3px}

/* tiles */
.tile{position:relative;aspect-ratio:3/4;overflow:visible;border:2px solid var(--ink);border-radius:5px;background:linear-gradient(180deg,var(--ivory) 0 78%,var(--ivory-sh) 78%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;color:var(--ink);box-shadow:0 3px 0 var(--jade),0 4px 0 var(--ink);transition:transform .12s}
.tile .face{width:84%;height:auto;display:block}
.tile .s{font-family:var(--f-serif);font-weight:900;font-size:clamp(11px,3vw,14px);margin-top:2px}
.tile .d{position:absolute;bottom:1px;right:3px;font-size:8.5px;font-weight:700;opacity:.5}
.tile .bonus{position:absolute;top:-7px;right:-6px;background:var(--gold);color:var(--ink);border:1.5px solid var(--ink);border-radius:99px;font-size:9px;font-weight:700;padding:0 3px;line-height:13px}
.tile.s0 .n,.tile.s0 .s{color:var(--crimson)}
.tile.s1 .n,.tile.s1 .s{color:var(--jade)}
.tile.s2 .n,.tile.s2 .s{color:var(--tile-blue)}
.tile.back{background:linear-gradient(135deg,var(--jade),#1d5a42);box-shadow:0 4px 0 var(--ink)}
.tile.back::after{content:"雀";font-family:var(--f-brush);color:rgba(241,229,202,.5);font-size:22px}
.tile.sel{transform:translateY(-12px)}
.tile.swapsel{transform:translateY(-12px);background:linear-gradient(180deg,#cfd8f0 0 78%,#a9b6dc 78%)}
.tile.new{box-shadow:0 3px 0 var(--jade),0 4px 0 var(--ink),0 0 0 3px var(--gold)}
.tile.rec::before{content:"";position:absolute;bottom:-12px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold)}
.tile.sm{width:24px;border-width:1.5px;border-radius:3px;box-shadow:0 2px 0 var(--ink)}
.tile.sm .face{width:92%}.tile.sm .d{display:none}
.tile.md{width:44px}
.tile.md .n{font-size:20px}

.hand{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 5px;padding-top:14px}
@media (min-width:640px){.hand{grid-template-columns:repeat(14,minmax(0,1fr))}}
.hand.n11{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (min-width:640px){.hand.n11{grid-template-columns:repeat(14,minmax(0,1fr))}}

.tray{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;background:rgba(0,0,0,.28);border:2px solid var(--ink)}
.tray .picks{display:flex;gap:14px}
.tray .tile{width:clamp(56px,16vw,72px)}

.pop{animation:pop .28s ease-out both}
.pop:nth-child(2){animation-delay:.06s}.pop:nth-child(3){animation-delay:.12s}
@keyframes pop{from{transform:translateY(16px) scale(.8);opacity:0}to{transform:none;opacity:1}}

/* hints */
.hint{background:var(--panel);border:2px solid var(--ink);padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.hint .waits{display:flex;flex-wrap:wrap;gap:8px}
.hint .w{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.hint .w b{color:var(--text)}
.win{border-color:var(--gold);background:linear-gradient(180deg,rgba(212,168,77,.22),rgba(9,13,27,.7))}
.win .big{font-family:var(--f-serif);font-weight:900;font-size:20px}
.ok{color:#9fe3b0}.no{color:#ffb4a8}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,8,18,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{background:var(--panel);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:560px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(3px)}
.card .art{position:relative;aspect-ratio:16/9;border:2px solid var(--ink);overflow:hidden}
.card .art svg{position:absolute;inset:0;width:100%;height:100%}
.card .art .subwrap{position:absolute;left:0;right:0;bottom:8px}
.card h3{margin:0;font-family:var(--f-serif);font-weight:900;font-size:20px;letter-spacing:.06em}
.card p{margin:0}

/* result */
.ledger{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ledger td{padding:3px 0;border-bottom:1px dashed rgba(185,181,203,.25)}
.ledger td:last-child{text-align:right}
.ledger tr.sum td{border-bottom:none;font-weight:700;padding-top:6px}
.total{font-family:var(--f-serif);font-weight:900;font-size:clamp(34px,10vw,52px);text-align:center;line-height:1.1;color:var(--ivory);text-shadow:3px 3px 0 var(--crimson)}
.formula{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.groups .g{display:flex;gap:1px}

/* shop */
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.offers{grid-template-columns:minmax(0,1fr)}}
.offer{border:3px solid var(--ink);background:var(--ivory);color:var(--ink);padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--ink)}
.offer h4{margin:0;font-family:var(--f-serif);font-weight:900;font-size:18px}
.offer .kind{font-size:11px;letter-spacing:.1em;color:#6b5a3a}
.offer p{margin:0;font-size:13.5px;flex:1}
.offer .btn{box-shadow:2px 2px 0 var(--ink);padding:.45em .8em}
.panel{background:var(--panel);border:2px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px}
.fantable{width:100%;border-collapse:collapse;font-size:13.5px}
.fantable td{padding:4px 6px;border-bottom:1px solid rgba(185,181,203,.2);vertical-align:top}
.fantable td:first-child{white-space:nowrap;font-family:var(--f-serif);font-weight:900}
.fantable td:nth-child(2){white-space:nowrap;color:var(--gold)}
.small{font-size:12.5px;color:var(--muted)}

/* ---------- v2: feedback layer ---------- */
.hid{display:none!important}
.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn .mini{display:inline-flex;gap:1px;vertical-align:middle;margin-left:4px}
.btn .mini .tile.sm{width:17px}
.btn.hu{animation:glow 1.1s ease-in-out infinite}
.btn.cash{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:3px 3px 0 var(--ink),0 0 0 0 rgba(212,168,77,.0)}50%{box-shadow:3px 3px 0 var(--ink),0 0 0 6px rgba(212,168,77,.45)}}
.chip.mute{background:transparent;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.popn{position:fixed;transform:translate(-50%,-100%);font-family:var(--f-serif);font-weight:900;font-size:17px;color:#fff;white-space:nowrap;
  text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);animation:popn .9s cubic-bezier(.2,.9,.3,1) forwards}
.popn.gold{color:var(--gold);font-size:19px}.popn.red{color:#ff7a68;font-size:22px}
@keyframes popn{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.25)}35%{transform:translate(-50%,-125%) scale(1)}100%{opacity:0;transform:translate(-50%,-210%) scale(1)}}
.stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:70}
.stamp span{font-family:var(--f-brush);font-size:clamp(76px,22vw,150px);line-height:1;color:var(--crimson);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);
  animation:stampin 1.15s cubic-bezier(.2,1.5,.4,1) forwards}
.stamp.gold span{color:var(--gold)}
@keyframes stampin{0%{transform:scale(2.8) rotate(-16deg);opacity:0}16%{transform:scale(1) rotate(-8deg);opacity:1}22%{transform:scale(1.08) rotate(-8deg)}30%{transform:scale(1) rotate(-8deg)}82%{opacity:1}100%{transform:scale(1.06) rotate(-8deg);opacity:0}}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:75;background:var(--ivory);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:8px 16px;display:flex;flex-direction:column;align-items:center;min-width:220px;animation:toast 3.2s ease forwards}
.toast b{font-family:var(--f-serif);font-weight:900}.toast span{font-size:12.5px}
@keyframes toast{0%{transform:translate(-50%,-140%)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-160%)}}
.jig{animation:jig .4s ease}
@keyframes jig{0%{transform:none}25%{transform:rotate(-9deg) scale(1.18)}50%{transform:rotate(7deg) scale(1.12)}75%{transform:rotate(-3deg) scale(1.04)}100%{transform:none}}
.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bigshake{animation:bigshake .5s ease}
@keyframes bigshake{0%,100%{transform:none}15%{transform:translate(-7px,4px) rotate(-.4deg)}30%{transform:translate(6px,-5px) rotate(.4deg)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}

/* goal bar */
.goal{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.goal .bar{flex:1;height:12px;border:2px solid var(--ink);background:rgba(0,0,0,.45);border-radius:99px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),#e0614f);transition:width .25s ease}
.goal.full .bar i{background:linear-gradient(90deg,var(--gold),#f3d48a)}
.goal b{color:var(--text);font-variant-numeric:tabular-nums}
.goal.full #bankv{color:var(--gold)}
.lamps i{font-style:normal}
.lamps i.off{color:#4b4f63}
.lamps i.dying{animation:dying 1.4s ease forwards}
@keyframes dying{0%,30%,50%{color:var(--gold);text-shadow:0 0 10px var(--gold)}20%,40%{color:#4b4f63}100%{color:#4b4f63;text-shadow:none}}

/* seats + table */
.seats{display:flex;flex-direction:column;gap:4px}
.seat{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:4px;border:1px solid transparent;transition:background .15s}
.seat.act{background:rgba(212,168,77,.14);border-color:rgba(212,168,77,.5)}
.seat .who{min-width:74px;font-size:12.5px;display:flex;flex-direction:column;line-height:1.15}
.seat .who small{color:var(--muted);font-size:10.5px;letter-spacing:.1em}
.seat.bossseat .who{color:#ffb4a8}
.sriv{display:flex;gap:2px;flex-wrap:wrap;min-height:30px;align-items:center}
.tile.dropin{animation:dropin .32s cubic-bezier(.2,1.6,.4,1)}
@keyframes dropin{from{transform:translateY(-14px) scale(1.4);opacity:0}to{transform:none;opacity:1}}
.tile.callme{animation:dropin .32s cubic-bezier(.2,1.6,.4,1),callme .9s ease-in-out .3s infinite;z-index:2}
@keyframes callme{0%,100%{box-shadow:0 2px 0 var(--ink),0 0 0 2px var(--gold)}50%{box-shadow:0 2px 0 var(--ink),0 0 0 5px rgba(212,168,77,.55)}}
.mine{display:flex;flex-direction:column;gap:3px}
.melds{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;align-items:flex-end;padding:6px;border:2px dashed rgba(212,168,77,.35);border-radius:6px}
.meld{display:flex;align-items:flex-end;gap:4px;padding:4px 6px 4px 4px;background:rgba(0,0,0,.28);border:2px solid var(--gold);border-radius:5px;position:relative}
.meld .src{position:absolute;top:-10px;left:-6px;background:var(--crimson);color:#fff;border:1.5px solid var(--ink);font-size:11px;padding:0 5px;border-radius:3px;font-weight:700}
.meld .mt{display:flex;gap:1px}
.meld .mc{font-family:var(--f-serif);font-weight:900;color:var(--gold);font-size:15px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums;display:inline-block}
.meld.fresh{animation:meldin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes meldin{from{transform:translateY(40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.tile.mx{width:30px;border-width:1.5px;border-radius:4px;box-shadow:0 2px 0 var(--jade),0 3px 0 var(--ink)}
.tile.mx .face{width:90%}.tile.mx .d{display:none}
.tile.drawn{animation:drawn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drawn{0%{transform:translate(30px,-46px) rotate(14deg) scale(1.2);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:none}}
.tile.sel.lift{animation:lift .18s cubic-bezier(.2,1.6,.4,1)}
@keyframes lift{from{transform:none}to{transform:translateY(-12px)}}
.tile.flipin{animation:flipin .45s ease}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:none}}
.hand{perspective:600px}
.callhint{border-color:var(--gold)}

/* settlement */
.settle .card{max-width:600px;gap:10px}
.sgroups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sg{display:flex;align-items:center;gap:5px;padding:4px 6px;border:2px solid rgba(185,181,203,.3);border-radius:5px;background:rgba(0,0,0,.25);transition:transform .15s,border-color .15s}
.sg.banked{border-color:var(--gold)}
.sg.on{transform:translateY(-4px) scale(1.06);border-color:#fff;background:rgba(212,168,77,.18)}
.sg .tg{font-size:11px;color:var(--muted)}
.sg .gt{display:flex;gap:1px}
.sg .gv{font-weight:900;font-family:var(--f-serif);color:var(--gold);font-variant-numeric:tabular-nums}
.scorebox{display:flex;align-items:stretch;justify-content:center;gap:10px}
.cbox,.fbox{min-width:120px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;padding:4px 10px;box-shadow:3px 3px 0 var(--ink)}
.cbox{background:#2a5ea8}.fbox{background:var(--crimson)}
.cbox small,.fbox small{font-size:11px;opacity:.85;letter-spacing:.2em}
.cbox b,.fbox b{font-family:var(--f-serif);font-weight:900;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;display:inline-block}
.xx{align-self:center;font-size:28px;font-weight:900;color:var(--muted)}
.fanlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:6px}
.fanchip{background:var(--ivory);color:var(--ink);border:2px solid var(--ink);font-family:var(--f-serif);font-weight:900;font-size:13px;padding:1px 8px;border-radius:3px;animation:chipin .35s cubic-bezier(.2,1.6,.4,1)}
.fanchip.base{background:transparent;color:var(--muted);border-color:var(--muted);animation:none}
.fanchip.x{background:var(--crimson);color:#fff}
@keyframes chipin{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}
.eq .total{animation:chipin .3s ease}
.verdict-line{text-align:center;font-family:var(--f-serif);font-weight:900;font-size:18px;animation:chipin .35s ease}
.verdict-line.ok{color:#9fe3b0}.verdict-line.no{color:#ffb4a8}
.tapskip{text-align:center;margin-top:-4px}
.result .ln{animation:lnin .35s ease both}
@keyframes lnin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
#money{display:inline-block}
#money.flash{animation:flash .55s ease}
@keyframes flash{0%{color:var(--text)}30%{color:var(--gold);transform:scale(1.5)}100%{transform:none}}
.slot.landed{animation:landed .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes landed{0%{transform:translateY(-30px) scale(1.4);opacity:0}100%{transform:none;opacity:1}}
.offer.deal{animation:deal .45s cubic-bezier(.2,1.4,.4,1) both}
.offer.deal:nth-child(2){animation-delay:.07s}.offer.deal:nth-child(3){animation-delay:.14s}
@keyframes deal{from{transform:rotateY(80deg) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.bossin{animation:bossin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes bossin{from{transform:translateY(-60px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

/* fate card */
.fate{display:flex;flex-direction:column;gap:14px;align-items:center}
.fcard{width:min(420px,100%);border:3px solid var(--ink);background:var(--ivory);color:var(--ink);box-shadow:7px 7px 0 var(--ink);animation:fatein .8s cubic-bezier(.2,1.2,.4,1)}
@keyframes fatein{0%{transform:rotateY(90deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.fimg{position:relative;aspect-ratio:4/5;overflow:hidden;border-bottom:3px solid var(--ink)}
.fimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fimg .subwrap{position:absolute;left:0;right:0;bottom:10px}
.fno{position:absolute;top:10px;right:12px;writing-mode:vertical-rl;font-family:var(--f-brush);font-size:30px;color:var(--ivory);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--crimson)}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);transform:translateX(-120%);animation:shine 1.6s ease .7s forwards}
@keyframes shine{to{transform:translateX(120%)}}
.fbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.fbody h2{margin:0;font-family:var(--f-brush);font-weight:400;font-size:34px;color:var(--crimson)}
.fbody p{margin:0;font-family:var(--f-serif);font-size:15.5px;line-height:1.75}
.pjc{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--f-serif);font-size:13px;color:#6b5a3a;border-top:1px dashed #b9a57a;padding-top:8px}
.pjc small{width:100%;font-size:11px;letter-spacing:.2em}
.pjc span.cut{text-decoration:line-through;text-decoration-color:var(--crimson);text-decoration-thickness:2px;opacity:.55}
/* verdict */
.vwrap{display:flex;flex-direction:column;gap:14px;align-items:center}
.vimg{position:relative;width:min(300px,80%);aspect-ratio:3/4;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.vimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vimg .subwrap{position:absolute;left:0;right:0;bottom:8px}.vimg .sub{font-size:12px}
.vpoem{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(520px,100%)}
.vpoem>div{display:flex;flex-direction:column;gap:6px;font-family:var(--f-serif);font-size:18px;background:var(--panel);border:2px solid var(--ink);padding:12px}
.vpoem .old span{position:relative;color:var(--muted)}
.vpoem .old span::after{content:"";position:absolute;left:0;top:52%;height:3px;width:0;background:var(--crimson);transition:width .45s ease}
.vpoem .old span.strike::after{width:100%}
.vpoem .new span{font-family:var(--f-brush);font-size:22px;color:var(--gold);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.vpoem .new span.ink{opacity:1;transform:none}
.vend{font-family:var(--f-serif);text-align:center;margin:0;max-width:28em;animation:lnin .6s ease}
@media (max-width:480px){.vpoem{grid-template-columns:1fr}}
/* album */
.album .acard{display:flex;gap:10px;border-top:1px solid rgba(185,181,203,.2);padding-top:10px}
.album .acard img{width:64px;height:84px;object-fit:cover;border:2px solid var(--ink);flex:none}
.album h4{margin:0 0 4px;font-family:var(--f-serif)}
.album ol,.album ul{margin:0;padding-left:1.3em;font-size:13px;display:flex;flex-direction:column;gap:2px}
.album .lock{color:#6f7088}
.album .poem{margin:6px 0 0;font-family:var(--f-brush);color:var(--gold);font-size:17px}



/* ---------- v8: the real table, bigger & richer ---------- */
.arena,.near{width:min(100vw,1120px);margin-left:calc(50% - min(50vw,560px))}
.arena{--t:min(34px,calc((100vw - 40px) / 16.9));--th:calc(var(--t)*1.34);--sw:calc(var(--t)*6 + 6px);--sh:calc(var(--th)*3 + 3px);--pond:calc(var(--sh)*2 + var(--sw));--edge:calc(var(--t)*1.4);
  --fh:calc(var(--pond) + var(--edge)*2);--fw:max(var(--fh),min(calc(var(--fh)*1.55),calc(100vw - 90px),980px));
  position:relative;overflow:hidden;padding:calc(var(--t)*2.2) 0 0;background:linear-gradient(180deg,#24150e 55%,#120a06);border-top:3px solid var(--ink);border-bottom:none}

.npc.left{left:calc(var(--t)*.4);top:16%}.npc.right{right:calc(var(--t)*.4);top:16%}
@media (min-width:760px){.npc.left{left:6%;top:22%}.npc.right{right:6%;top:22%}.npc{--a:calc(var(--t)*2.9)}}
.ava{width:var(--a);height:var(--a);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-brush);font-size:calc(var(--a)*.58);color:var(--crimson);background:radial-gradient(circle at 40% 35%,#fff7e4,var(--ivory) 55%,#d9c49a);
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--ink),4px 6px 0 5px rgba(0,0,0,.45);transition:box-shadow .2s}
.npc.boss .ava{background:radial-gradient(circle at 40% 35%,#5a1d24,#2a0a10);color:#ffb4a8}
.npc.act .ava{box-shadow:0 0 0 3px #ffd678,0 0 0 5px var(--ink),0 0 22px 8px rgba(255,200,100,.55);animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.nm{background:linear-gradient(#4a1810,#2a0c07);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--gold);color:#f6e6c4;font-family:var(--f-serif);font-weight:900;
  font-size:calc(var(--t)*.6);padding:1px 8px 2px;text-align:center;line-height:1.2;white-space:nowrap}
.nm small{display:block;font-family:var(--f-sans);font-weight:400;font-size:calc(var(--t)*.48);color:#d4b98a;letter-spacing:.15em}
.persp{position:relative;z-index:2;perspective:calc(var(--t)*46);display:flex;justify-content:center;padding-bottom:calc(var(--t)*1.6)}
.tabletop{position:relative;transform:rotateX(38deg);transform-origin:50% 100%;padding:calc(var(--t)*.6);border-radius:calc(var(--t)*.9);border:3px solid var(--ink);
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.09) 7px 9px,rgba(255,255,255,.03) 9px 12px),linear-gradient(135deg,#7a2a1a,#45160d 55%,#6a2416);
  box-shadow:inset 0 0 0 2px #9a4a2c,inset 0 0 0 calc(var(--t)*.25) rgba(0,0,0,.15),0 calc(var(--t)*.55) 0 #3a1109,0 calc(var(--t)*.55 + 3px) 0 var(--ink),0 calc(var(--t)*2) calc(var(--t)*1.6) rgba(0,0,0,.65)}
.tabletop::before{content:"";position:absolute;inset:calc(var(--t)*.22);border:1.5px solid rgba(212,168,77,.75);border-radius:calc(var(--t)*.7);pointer-events:none}
.corner{position:absolute;width:calc(var(--t)*1.6);height:calc(var(--t)*1.6);z-index:2;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M4 36 V14 Q4 4 14 4 H36' fill='none' stroke='%2317110f' stroke-width='6'/><path d='M4 36 V14 Q4 4 14 4 H36' fill='none' stroke='%23e2b85a' stroke-width='3'/><path d='M10 22 q0 -12 12 -12 q6 0 6 6 q0 5 -5 5 q-4 0 -4 -4' fill='none' stroke='%2317110f' stroke-width='5' stroke-linecap='round'/><path d='M10 22 q0 -12 12 -12 q6 0 6 6 q0 5 -5 5 q-4 0 -4 -4' fill='none' stroke='%23e2b85a' stroke-width='2.5' stroke-linecap='round'/></svg>") center/contain no-repeat}
.corner.tl{left:-2px;top:-2px}.corner.tr{right:-2px;top:-2px;transform:scaleX(-1)}.corner.bl{left:-2px;bottom:-2px;transform:scaleY(-1)}.corner.br{right:-2px;bottom:-2px;transform:scale(-1,-1)}
.felt{position:relative;width:var(--fw);height:var(--fh);border:2px solid var(--ink);border-radius:calc(var(--t)*.35);overflow:hidden;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><path d='M17 5 L29 17 L17 29 L5 17Z' fill='none' stroke='%23e2c37a' stroke-opacity='.13' stroke-width='1'/><path d='M17 11 L23 17 L17 23 L11 17Z' fill='none' stroke='%23e2c37a' stroke-opacity='.09' stroke-width='1'/><circle cx='17' cy='17' r='1.6' fill='%23e2c37a' fill-opacity='.18'/><circle cx='0' cy='0' r='1.6' fill='%23e2c37a' fill-opacity='.14'/><circle cx='34' cy='34' r='1.6' fill='%23e2c37a' fill-opacity='.14'/></svg>"),
    radial-gradient(ellipse at 50% 38%,#3b8a6e,#22594a 55%,#163d33);
  box-shadow:inset 0 0 0 calc(var(--t)*.18) #1a4a3a,inset 0 0 0 calc(var(--t)*.25) rgba(226,195,122,.5),inset 0 0 calc(var(--t)*2) rgba(0,0,0,.55)}
.felt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(255,228,160,.22),transparent 58%)}
.wall{position:absolute;display:flex;gap:1px;z-index:1}
.wall i{display:block;border:1px solid var(--ink);border-radius:3px;
  background:linear-gradient(180deg,#fbf2dc 0 28%,#d9c49a 28% 34%,#3fa07a 34%,#1d5a42);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.wall.w1{top:calc(var(--edge)*.18);left:50%;transform:translateX(-50%)}
.wall.w1 i{width:calc(var(--t)*.86);height:calc(var(--t)*1.12)}
.wall.w2,.wall.w0{flex-direction:column;top:50%;transform:translateY(-50%)}
.wall.w2{left:calc(var(--edge)*.18)}.wall.w0{right:calc(var(--edge)*.18)}
.wall.w2 i,.wall.w0 i{width:calc(var(--t)*1.12);height:calc(var(--t)*.86)}
.wall.w2 i{background:linear-gradient(90deg,#fbf2dc 0 28%,#d9c49a 28% 34%,#3fa07a 34%,#1d5a42)}
.wall.w0 i{background:linear-gradient(270deg,#fbf2dc 0 28%,#d9c49a 28% 34%,#3fa07a 34%,#1d5a42)}
.pond{position:absolute;left:50%;top:var(--edge);width:var(--pond);height:var(--pond);transform:translateX(-50%);z-index:1}
.ps{position:absolute;width:var(--sw);height:var(--sh);display:flex;flex-wrap:wrap;align-content:flex-start;gap:1px}
.ps.p3{left:var(--sh);top:calc(var(--sh) + var(--sw))}
.ps.p1{left:var(--sh);top:0;transform:rotate(180deg)}
.ps.p2{left:calc(var(--sh)/2 - var(--sw)/2);top:calc(var(--sh)/2 + var(--sw)/2);transform:rotate(90deg)}
.ps.p0{left:calc(var(--sh)*1.5 + var(--sw)/2);top:calc(var(--sh)/2 + var(--sw)/2);transform:rotate(-90deg)}
.tile.pd{width:var(--t);border-width:1px;border-radius:3px;box-shadow:0 2px 0 var(--ivory-sh),0 3px 0 var(--ink),1px 4px 3px rgba(0,0,0,.35)}
.tile.pd .face{width:90%}.tile.pd .d{display:none}
.tile.pd.callme{z-index:3;animation:dropin .32s cubic-bezier(.2,1.6,.4,1),callme2 .8s ease-in-out .3s infinite}
@keyframes callme2{0%,100%{box-shadow:0 0 0 2px var(--gold)}50%{box-shadow:0 0 0 5px rgba(255,214,120,.8),0 0 16px 5px rgba(255,214,120,.65)}}
.compass{position:absolute;left:calc(var(--sh) + var(--sw)*.07);top:calc(var(--sh) + var(--sw)*.07);width:calc(var(--sw)*.86);height:calc(var(--sw)*.86);border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#b07a3c,#7a4a1e 45%,#3e2210 80%);border:2px solid var(--ink);
  box-shadow:0 0 0 calc(var(--t)*.18) #d4a84d,0 0 0 calc(var(--t)*.18 + 2px) var(--ink),inset 0 0 0 calc(var(--t)*.45) rgba(0,0,0,.18),inset 0 0 0 calc(var(--t)*.5) rgba(240,200,120,.35),3px 5px 8px rgba(0,0,0,.5)}
.compass b{position:absolute;font-family:var(--f-serif);font-weight:900;font-size:calc(var(--t)*.82);color:#f0d6a4;opacity:.45;transition:all .2s}
.compass .c1{top:7%;left:50%;transform:translateX(-50%) rotate(180deg)}
.compass .c3{bottom:7%;left:50%;transform:translateX(-50%)}
.compass .c2{left:8%;top:50%;transform:translateY(-50%) rotate(90deg)}
.compass .c0{right:8%;top:50%;transform:translateY(-50%) rotate(-90deg)}
.compass b.on{opacity:1;color:#fff2c4;text-shadow:0 0 6px #ffb84a,0 0 14px #ff9a2a}
.compass .cc{position:absolute;inset:26%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  background:radial-gradient(circle,#2a160a,#140a04);border:1.5px solid rgba(240,200,120,.6);color:var(--ivory)}
.compass .cc em{font-style:normal;font-family:var(--f-serif);font-weight:900;font-size:calc(var(--t)*1.25);color:#ffe2a0}
.compass .cc small{font-size:calc(var(--t)*.45);color:#c9b08a;margin-top:1px}
.near{position:relative;z-index:3;margin-top:-12px;padding:12px max(12px,calc(50% - 450px)) 14px;display:flex;flex-direction:column;gap:8px;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,0) 0 7px,rgba(0,0,0,.09) 7px 9px,rgba(255,255,255,.03) 9px 12px),linear-gradient(180deg,#6a2416,#3a1109);
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);box-shadow:inset 0 3px 0 #9a4a2c,inset 0 5px 0 rgba(212,168,77,.6),0 6px 0 var(--ink)}
.near .melds{border-color:rgba(212,168,77,.45);background:rgba(0,0,0,.2)}
.near .hand{padding-top:14px}


/* v9: match screen uses the full width; bigger table */
@media (min-width:900px){#app[data-screen=match]{max-width:1120px}}
.arena{--t:min(40px,calc((100vw - 30px) / 17.9))}
.tabletop{transform:rotateX(33deg)}
.arena{padding-top:calc(var(--t)*2.6)}


/* ---------- v10: game layout — sidebar scoreboard, big numbers, table fits the screen ---------- */
#app[data-screen=match]{font-size:16px}
.mlayout{display:flex;flex-direction:column;gap:10px}
.play{display:flex;flex-direction:column;gap:10px;min-width:0}
.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sbox{background:var(--panel);border:2px solid var(--ink);padding:8px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--text)}
.sbox small{font-size:12px;color:var(--muted);letter-spacing:.12em}
.stagebox b{font-family:var(--f-serif);font-weight:900;font-size:18px;letter-spacing:.04em}
.stagebox span{font-size:13px;color:var(--muted)}
.bossbox{border-color:var(--crimson);background:linear-gradient(180deg,rgba(179,53,44,.35),rgba(9,13,27,.7))}
.bossbox b{font-family:var(--f-serif);font-weight:900;color:#ffb4a8;font-size:16px}.bossbox span{font-size:13px}
.score{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;align-items:end;padding:10px 14px}

.score .tgt b{font-size:34px;color:#ff8f7e;text-shadow:2px 2px 0 var(--ink)}
.score .bank b{font-size:46px;color:#8fc4ff;text-shadow:3px 3px 0 var(--ink)}
.score.full .bank b{color:var(--gold)}
.score .bar{grid-column:1/-1;height:14px;border:2px solid var(--ink);background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden}
.score .bar i{display:block;height:100%;background:linear-gradient(90deg,#3a76c4,#8fc4ff);transition:width .25s ease}
.score.full .bar i{background:linear-gradient(90deg,var(--gold),#f3d48a)}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px 10px}
.stats>div{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.28);border:1px solid rgba(185,181,203,.2);border-radius:4px;padding:4px 2px}
.stats b{font-family:var(--f-serif);font-weight:900;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;font-size:11px;color:var(--muted)}
.stats .lamps{font-size:18px;line-height:1.6}
#money::before{content:"$";font-size:.7em;color:var(--gold);margin-right:1px}
.who{grid-column:1/-1}.who b{font-family:var(--f-serif);font-weight:900;font-size:15px}.who span{font-size:13px;color:var(--muted)}
.side .shelf{grid-column:1/-1}
.sidebtns{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.sidebtns .chip{background:transparent;cursor:pointer;font-size:13px;padding:3px 10px}
.side .shint{display:none}
.phint .hint{font-size:15.5px}
.actions .btn{font-size:17px;padding:.6em 1.2em}
.hint{font-size:15px}
.hint .w{font-size:13.5px}
.bgscene img{width:100%;height:100%;object-fit:cover;display:block}
.felt.imgtable{background-size:cover;background-position:center;box-shadow:inset 0 0 calc(var(--t)*1.2) rgba(0,0,0,.45)}
.felt.imgtable::before{display:none}
.near.imgrail{background-size:cover;background-position:center}
.fig{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));transition:filter .2s}
.fig.top{left:50%;transform:translateX(-50%);top:0;height:calc(var(--t)*6.6)}

@keyframes tutpulse{50%{box-shadow:0 0 0 6px rgba(226,184,92,.12),0 0 28px rgba(226,184,92,.85)}}
#tut .tutbox{position:absolute;pointer-events:auto;display:flex;gap:12px;align-items:flex-start;background:#f3e6c8;color:#2a1d12;border:3px solid var(--ink,#1a120c);border-radius:12px;box-shadow:6px 6px 0 var(--ink,#1a120c);padding:12px 14px;transition:left .25s ease,top .25s ease}
#tut .tutbox.pop{animation:tutpop .28s cubic-bezier(.2,1.5,.4,1)}
#tut .tutbox.nudge{animation:tutnudge .35s ease}
@keyframes tutpop{from{transform:scale(.9);opacity:0}}
@keyframes tutnudge{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#tut .tutava{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid var(--ink,#1a120c);background:#5b3a2a}
#tut .tutava img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 12%;transform:scale(1.5);transform-origin:50% 20%}
#tut .tutbody{flex:1;min-width:0}
#tut .tutname{font-family:var(--f-serif);font-weight:900;font-size:15px;color:#8a2a1c}
#tut .tutname small{font-weight:400;font-size:11px;color:#7a6550;margin-left:4px}
#tut .tuttext{font-size:14px;line-height:1.65;margin-top:2px}
#tut .tuttext b{color:#8a2a1c}
#tut .tuttext q{display:block;margin:6px 0 2px;font-family:var(--f-serif);font-weight:700;font-size:15px;quotes:"「" "」"}
#tut .tuttext small{display:block;font-size:11px;color:#7a6550}
#tut .tutfoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
#tut .tutn{font-size:11px;color:#7a6550}
#tut .tutnext{padding:.35em 1.1em}
#tut .tutx{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));pointer-events:auto;z-index:2;font:inherit;font-family:var(--f-serif);font-weight:700;font-size:13px;letter-spacing:.06em;padding:.4em .9em;border-radius:99px;border:2px solid rgba(243,230,200,.75);background:rgba(26,18,12,.72);color:#f3e6c8;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#tut .tutx:hover{background:#8a2a1c;border-color:#f3e6c8}
.sctenpai{margin:3px auto 0;width:max-content;padding:1px 10px;border-radius:99px;background:#b8402e;color:#fff6e4;font-family:var(--f-serif);font-weight:900;font-size:calc(var(--t)*.4);letter-spacing:.2em;animation:tenpai 1.2s ease-in-out infinite;box-shadow:0 0 0 2px rgba(184,64,46,.35)}
@keyframes tenpai{50%{box-shadow:0 0 0 6px rgba(184,64,46,.12),0 0 14px rgba(255,120,90,.7)}}
.scriver{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-items:center;margin-top:3px;opacity:.85}
.scriver small{font-size:calc(var(--t)*.3);color:#7a6550;margin-right:3px}
.scriver .stile,.scriver span,.scriver i{transform:scale(.85)}
.pname{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.pname input{font:inherit;font-size:15px;padding:.45em .8em;border:2px solid var(--ink,#1a120c);border-radius:8px;background:#f3e6c8;color:#2a1d12;width:11em}
.pname input:focus{outline:2px solid var(--gold,#e2b85c);outline-offset:2px}
.card.board{width:min(640px,100%);max-height:100%;overflow:auto}
.btabs{display:flex;gap:8px;justify-content:center;margin:4px 0 6px}
.btabs .chip.on{background:var(--crimson,#b8402e);color:#fff6e4;border-color:var(--crimson,#b8402e)}
.bwrap{overflow-x:auto}
.btable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.btable th{white-space:nowrap;font-weight:400;font-size:12px;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.15)}
.btable td{padding:6px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
.btable td.b-rk{font-family:var(--f-serif);font-weight:900;width:2.5em}
.btable td.b-nm{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.btable td.b-sc{text-align:right;font-family:var(--f-serif);font-weight:900}
.btable tr:nth-child(1) td.rk{color:var(--gold,#e2b85c)}.btable tr:nth-child(2) td.rk{color:#d6dbe0}.btable tr:nth-child(3) td.rk{color:#d79a63}
.btable tr.b-me td{background:rgba(226,184,92,.16)}
.bsrc{text-align:center;opacity:.7}
.card.lbend{width:min(560px,100%);margin:10px auto}
.lbstat{display:flex;gap:10px;justify-content:center;margin:6px 0}
.lbstat div{flex:1;text-align:center;border:2px solid var(--ink,#1a120c);border-radius:8px;padding:6px 4px;background:rgba(0,0,0,.25)}
.lbstat small{display:block;font-size:12px;color:var(--muted)}
.lbstat b{font-family:var(--f-serif);font-size:18px}
.lbok{text-align:center;color:#7fd67f}
/* 2.14 小窗口：侧栏各块不被挤扁、可滚动；出牌按钮永远贴在屏幕底部 */
@media (min-width:900px){
  .side>*{flex-shrink:0}
  .play{overflow-y:auto;overflow-x:hidden}
  .play>.actions{position:sticky;bottom:0;z-index:30;margin-top:auto;padding:8px 0 10px;background:linear-gradient(180deg,rgba(13,11,9,0),rgba(13,11,9,.92) 35%)}
}
/* 2.15 手机：出牌按钮贴底；台词气泡不出屏 */
@media (max-width:899px){
  .play>.actions{position:sticky;bottom:0;z-index:30;padding:8px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,11,9,0),rgba(13,11,9,.94) 30%)}
  .me .bubble{max-width:min(calc(var(--t)*8),calc(100vw - var(--t)*3.4 - 40px))}
}

/* ===== 2.23 游戏字 vs 文学字 =====
   游戏字（效果、数字、规则）：亮、粗、按作用上色 —— 蓝=筹码，红=番，红底白字=×倍，金=银两
   文学字（原书引文、人物台词、注释、故事）：小一号、暗蓝灰、半透明、宋体细字，扫一眼就能跳过 */
:root{--lore:#7f8da3;--lore-l:#7b8494;--c-chip:#5fb0ff;--c-fan:#ff7656;--c-gold:#f2c14e}
.num{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--f-sans,inherit)}
.n-chip{color:var(--c-chip)}
.n-fan{color:var(--c-fan)}
.n-money{color:var(--c-gold)}
.n-mult{color:#fff;background:#c8402c;border:1.5px solid #0d0b09;border-radius:4px;padding:0 4px;margin:0 1px;box-shadow:1px 1px 0 #0d0b09}
.lore{font-family:var(--f-serif);font-weight:400!important;color:var(--lore)!important;opacity:.82}
/* 道具卡：效果放大提亮，诗句缩小变暗 */
.teff{font-size:15.5px;color:#fbf3df;font-weight:500;line-height:1.65}
.tcard.codex .teff{font-size:14px}
.tflav.lore{font-size:11.5px;line-height:1.55;flex:1}
.tcard.info .tflav.lore{font-size:13px}
.tcard .tline{opacity:.35}
/* 浅色底上（对话框、气泡、命运卡）数字换深一点的色 */
#tut .num.n-chip,.bubble .num.n-chip,.fcard .num.n-chip{color:#1f63b8}
#tut .num.n-fan,.bubble .num.n-fan,.fcard .num.n-fan{color:#b8301c}
#tut .num.n-money,.bubble .num.n-money,.fcard .num.n-money{color:#9a6a00}
/* 引导：鸳鸯的话是教学（正常），原书引文和出处是文学（淡） */
#tut .tuttext q{font-weight:400;font-size:12.5px;color:var(--lore-l);margin:5px 0 0;opacity:.9}
#tut .tuttext small{font-size:10.5px;color:#a2a8b2}
/* 人物台词气泡：淡一些、小一些；台词下面的出处注释更淡 */
.me .bubble{font-size:calc(var(--t)*.4);font-weight:500;color:#4d5563}
.resay .bubble{font-size:15px;font-weight:500;color:#4d5563}
.resay.mini .bubble{font-size:13.5px}
.bubble .ln2.lore{font-size:.72em;color:#8b919b!important;opacity:.9;border-top-color:rgba(77,85,99,.25)}
/* 命运卡：故事都退后，唯一的游戏信息（判词进度）做成醒目的条 */
.fseg.set p{font-size:13.5px;color:#6b7280;line-height:1.75}
.fseg.quote{background:rgba(91,100,114,.06);border-left-color:#9aa3b0}
.fseg.quote small{color:#8a909a}
.fseg.quote p.fq{font-size:15px;font-weight:700;color:#5b6472}
.fseg.quote p.fqx{font-size:12.5px;color:#8a909a}
.fseg.turn p{font-size:15.5px;font-weight:700;color:#3d3a40}
.pjc{color:#7b8494}
.pjn{display:block;margin-top:4px;background:#16120e;color:var(--c-gold)!important;font-weight:700;font-size:13px!important;line-height:1.5;padding:7px 11px;border-radius:6px;border:2px solid var(--c-gold);font-family:var(--f-sans,inherit)}
/* 地名、英文副标题这类装饰字 */
.stagebox span{color:var(--lore)}
.sub .en{opacity:.6}

/* 2.23 手机集市：三张一排的小卡，诗句收起（点卡片的「查看」或图鉴里还能看到） */
@media (max-width:520px){
  #app[data-screen=shop] .offers{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  #app[data-screen=shop] .tcard{padding:0 6px 7px;gap:3px}
  #app[data-screen=shop] .tban{margin:0 -6px 2px;padding:4px 2px 5px;font-size:13.5px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app[data-screen=shop] .tframe{width:70%}
  #app[data-screen=shop] .tcard.cons .tframe{width:58%}
  #app[data-screen=shop] .tkind{font-size:9.5px;letter-spacing:0;line-height:1.3}
  #app[data-screen=shop] .teff{font-size:12px;line-height:1.45;min-height:0;flex:1}
  #app[data-screen=shop] .tflav,#app[data-screen=shop] .tline{display:none}
  #app[data-screen=shop] .tcard .btn{font-size:13px;padding:6px 2px;margin-top:2px}
  #app[data-screen=shop] .shelf{gap:4px}
  #app[data-screen=shop] .shelf .slot{min-height:40px;padding:2px!important;justify-content:center!important}
  #app[data-screen=shop] .shelf .slot .snm{display:none}
  #app[data-screen=shop] .shelf .slot .sico{width:32px;height:32px}
  #app[data-screen=shop] .hud{flex-wrap:wrap;row-gap:4px}
}

/* ===== 2.24 手机竖屏版（html.phone 由 phone.js 设）=====
   设计稿：大观园雀局 · 手机版设计稿。从上到下：顶栏、三家、分数条、珍玩与签、牌桌（只缩这块）、选中预览、手牌两排、按钮 */
html.phone [data-tip]{cursor:pointer}
html.phone #app[data-screen=match]{max-width:560px;height:100vh;height:100dvh;box-sizing:border-box;padding:env(safe-area-inset-top) 0 0;display:flex;flex-direction:column;overflow:hidden;font-size:15px}
html.phone #app[data-screen=match] .mlayout{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;height:auto}
html.phone .ptop{flex:none;display:flex;flex-direction:column;gap:6px;padding:0 10px 7px}
.pbar1{height:44px;display:flex;align-items:center;gap:8px;margin-left:-8px}
.pmenu{width:44px;height:44px;border:none;background:transparent;color:#d9cfb8;display:flex;align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer}
.pttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pttl b{font-family:var(--f-serif);font-weight:900;font-size:16px;letter-spacing:.05em;color:var(--ivory);white-space:nowrap}
.pttl small{font-size:11px;color:var(--lore);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plamps{font-size:15px;flex:none}
.pmoney{flex:none;height:30px;padding:0 11px;border-radius:15px;background:#1f1810;border:1.5px solid #8a6a2c;display:flex;align-items:center}
.pmoney #money{font-weight:900;font-size:17px;color:var(--c-gold)}
.pboss{font-size:12px;line-height:1.5;background:linear-gradient(90deg,rgba(179,53,44,.4),rgba(179,53,44,.12));border:1px solid var(--crimson);border-radius:8px;padding:4px 10px;color:#f4ded8}
.pboss>b:first-child{color:#ffb4a8;margin-right:6px;font-family:var(--f-serif)}
.popp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:2px}
.popp .scard.pchip{position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none;width:auto;margin:0;height:58px;box-sizing:border-box;border-radius:10px;background:#1a1714;border:1.5px solid #3a3128;box-shadow:none;padding:5px 6px;display:flex;gap:6px;align-items:center;color:var(--text);text-align:left;font:inherit;z-index:auto;cursor:pointer;min-width:0}
.pchip .pcimg{width:34px;height:44px;flex:none;border-radius:6px;overflow:hidden;background:#2a1f18;display:flex;align-items:center;justify-content:center;color:var(--ivory);font-family:var(--f-serif);font-weight:900}
.pchip .pcimg img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.pcbody{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.pcbody small{font-size:10px;color:#8d8a80}
.pcname{font-family:var(--f-serif);font-weight:900;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcwant{font-size:11px;color:#a9b1ad;white-space:nowrap}
.pcwant b.s0,.pgame b.s0{color:#ff7a5c}.pcwant b.s1,.pgame b.s1{color:#7fd67f}.pcwant b.s2,.pgame b.s2{color:#6cb6ff}
.pcscore{color:var(--ivory);font-size:13px}
.popp .scard.pchip.lead{border-color:#ff7a5c}
.popp .scard.pchip.boss{background:#2a1512;border-color:var(--crimson)}
.popp .scard.pchip.tp{border-color:#e0533a;box-shadow:0 0 0 1px rgba(224,83,58,.45)}
.pctag{position:absolute;top:-8px;right:-4px;background:#b3352c;color:#fff;font-style:normal;font-size:10.5px;font-weight:900;padding:0 7px;border-radius:9px;border:1.5px solid #0d0b09;letter-spacing:.08em;line-height:16px;animation:tenpai 1.2s ease-in-out infinite}
.pctag.hu{background:var(--c-gold);color:#1a120c;animation:none}
.ptop .pscore{grid-column:auto;display:flex;flex-direction:column;gap:5px;padding:7px 12px 8px;border-radius:12px;background:linear-gradient(180deg,#213b37,#182d2a);border:2px solid #0d0b09;box-shadow:0 3px 0 #0d0b09;overflow:visible}
.ps1{display:flex;align-items:baseline;gap:7px}
.ps1 small{display:inline;white-space:nowrap;font-size:12px;color:#a9b1ad;letter-spacing:0}
html.phone body{margin:0}
.ps1 #bankv{font-family:var(--f-serif);font-weight:900;font-size:30px;line-height:1;color:#8fc4ff;text-shadow:2px 2px 0 #0d0b09;font-variant-numeric:tabular-nums}
.pscore.full .ps1 #bankv{color:var(--c-gold)}
.ps1 .tup{font-style:normal;font-size:11px;color:#ff8a6a}
.pline{font-family:var(--f-serif);font-weight:900;font-size:19px;line-height:1;color:var(--c-gold)}
.pline.ok{color:#7fd67f}
.grow{flex:1}
.pbar{position:relative;height:11px;box-sizing:border-box;border-radius:6px;background:#0b1413;border:1.5px solid #0d0b09}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#3a76c4,#8fc4ff);transition:width .25s ease}
.pscore.full .pbar i{background:linear-gradient(90deg,var(--gold),#f3d48a)}
.pbar em{position:absolute;top:-5px;width:3px;height:19px;margin-left:-1.5px;background:#ff7a5c;border-radius:2px;box-shadow:0 0 0 1px #0d0b09}
.ps3{display:flex;align-items:center;gap:10px;font-size:11.5px;color:#a9b1ad;white-space:nowrap;min-width:0}
.ps3>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.popp-top{color:#ff7a5c}
.pips{display:flex;align-items:center;gap:3px;flex:none}
.pips i{width:8px;height:8px;border-radius:50%;background:#e0533a}
.pips.pipS i{background:#c9cfcb}
.pips b{color:var(--ivory)}
.prelic{display:flex;align-items:center;gap:6px}
.prelic .shelf{display:flex;gap:6px;flex:1 1 auto;min-width:0}
.prelic .slot{flex:1 1 0;max-width:46px;min-width:0;aspect-ratio:1;height:auto;min-height:0!important;padding:0!important;justify-content:center!important;border-radius:8px;box-sizing:border-box}
.prelic .slot .snm{display:none}
.prelic .slot .sico{width:100%;height:100%;border:none;box-shadow:none;border-radius:6px}
.prelic .slot:not(.full){font-size:0}
.prelic .psep{width:1px;height:28px;background:#3d4a46;flex:none}
.prelic .consbar{display:flex;gap:6px;flex:0 0 33%;min-width:0}
.prelic .cslot{flex:1 1 0;min-width:0;height:44px;min-height:0;padding:0 4px;font-size:12px;gap:3px}
.prelic .cslot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prelic .cslot .sico{width:26px;height:26px;flex:none}
.prelic .cslot .sico+span{display:none}
.prelic .lvline{display:none}
/* 牌桌：占剩下的高度，桌子由 phone.js 整体缩放 */
html.phone #app[data-screen=match] .play{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;height:auto;overflow:visible}
html.phone #app[data-screen=match] .arena{flex:1 1 0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0!important;--t:20px;width:auto!important;margin:0!important;border:none!important;border-top:2px solid #0d0b09!important;overflow:hidden}
html.phone .arena .scard,html.phone .arena .placard,html.phone .arena .fig,html.phone .arena .npc{display:none!important}
html.phone .arena .persp{flex:none;transform-origin:50% 50%;padding:0!important;margin:0}
html.phone .arena .me{left:8px;bottom:6px;transform:none}
html.phone .arena .me .meimg{width:44px}
html.phone .arena .me .mename{font-size:11px;padding:0 6px}
html.phone .arena .me .bubble{left:54px;bottom:12px;max-width:calc(100vw - 150px)!important;font-size:12.5px;padding:5px 9px}
.pskill{position:absolute;right:8px;bottom:8px;z-index:10;min-height:34px;background:rgba(13,11,9,.88);border:1.5px solid #8a6a2c;border-radius:8px;padding:2px 12px;font-family:var(--f-serif);font-weight:900;font-size:13px;color:var(--c-gold);cursor:pointer}
html.phone .playpane{transform:translate(-50%,-50%) scale(calc(var(--pps,.9) * .9))}
html.phone .playpane.on{transform:translate(-50%,-50%) scale(var(--pps,.9))}
html.phone .me .bubble .ln2{display:none}
html.phone .me .bubble{font-size:12px;max-width:min(60vw,240px)!important}
html.phone .arena:has(.playpane.on) .me .bubble{opacity:0!important}
/* 手牌区 */
html.phone #app[data-screen=match] .near{flex:none;margin:0!important;padding:6px 10px 2px!important;gap:4px;width:auto!important;border-left:none!important;border-right:none!important}
html.phone .near .melds{min-height:0;padding:4px 8px;gap:8px;flex-wrap:nowrap;align-items:center;border-radius:8px}
html.phone .near .shown{display:none}
html.phone .near .huprog{flex:none;font-size:11px;padding:2px 7px;gap:6px;white-space:nowrap}
html.phone .near .huprog>b{display:none}
html.phone .near .pv{flex:1;min-width:0;justify-content:flex-end;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;gap:5px;font-size:12px}
html.phone .near .pv.empty{display:block;text-overflow:ellipsis;color:#b9ad95}
html.phone .near .pv .pvt{font-size:15px!important}
html.phone .near .pv .pvn,html.phone .near .pv .pvn *{font-size:15px!important;line-height:1.25}
html.phone .near .pv .pvn i{padding:0 5px!important}
html.phone .near .pv .pvtag{font-size:10px!important;padding:0 4px!important}
html.phone .near .pv>.small{display:none}

// 大观园雀局 · rules engine v2 (pure, no DOM)
// tile index 0-26: suit = floor(i/9) (0 万, 1 条, 2 筒), rank = i%9+1
const SUITS = ['万', '条', '筒'];
const NUMS = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
const suitOf = t => Math.floor(t / 9);
const rankOf = t => (t % 9) + 1;
const isTerm = t => rankOf(t) === 1 || rankOf(t) === 9;
const tileName = t => NUMS[rankOf(t) - 1] + SUITS[suitOf(t)];
const meldTypes = m => m.k === 'chow' ? [m.t, m.t + 1, m.t + 2] : m.k === 'kong' ? [m.t, m.t, m.t, m.t] : m.k === 'pair' ? [m.t, m.t] : [m.t, m.t, m.t];

function countsOf(tiles) {
  const c = new Array(27).fill(0);
  for (const x of tiles) c[x.t]++;
  return c;
}

function meldSplits(c, need, start, acc, out) {
  if (need === 0) {
    for (let i = 0; i < 27; i++) if (c[i]) return;
    out.push(acc.slice());
    return;
  }
  let i = start;
  while (i < 27 && c[i] === 0) i++;
  if (i >= 27) return;
  if (c[i] >= 3) { c[i] -= 3; acc.push({ k: 'pung', t: i }); meldSplits(c, need - 1, i, acc, out); acc.pop(); c[i] += 3; }
  if (rankOf(i) <= 7 && c[i + 1] && c[i + 2]) {
    c[i]--; c[i + 1]--; c[i + 2]--; acc.push({ k: 'chow', t: i });
    meldSplits(c, need - 1, i, acc, out);
    acc.pop(); c[i]++; c[i + 1]++; c[i + 2]++;
  }
}

// decompositions of the concealed hand, given how many melds are already exposed
function decompositions(handTiles, exposedCount) {
  const c = countsOf(handTiles);
  const need = 4 - exposedCount;
  const total = c.reduce((a, b) => a + b, 0);
  if (total !== need * 3 + 2) return [];
  const res = [];
  for (let p = 0; p < 27; p++) {
    if (c[p] < 2) continue;
    c[p] -= 2;
    const out = [];
    meldSplits(c, need, 0, [], out);
    c[p] += 2;
    for (const m of out) res.push({ pair: p, melds: m, seven: false });

  if (exposedCount === 0 && total === 14 && c.every(n => n % 2 === 0)) {
    const pairs = [];
    c.forEach((n, i) => { for (let k = 0; k < n / 2; k++) pairs.push(i); });
    res.push({ seven: true, pairs });
  }
  return res;
}
const isWin = (hand, exposedCount) => decompositions(hand, exposedCount).length > 0;

// concealed melds that could be laid out right now (distinct)

  const c = countsOf(hand), out = [];

// ---------- scoring ----------
// meld levels (学「星球牌」): each level adds chips to that meld type
const LV_CHIPS = { chow: 8, pung: 12, kong: 20, pair: 6 };
const MELD_CN = { chow: '顺子', pung: '刻子', kong: '杠', pair: '雀头' };
function meldChips(m, ctx) {
  const term = isTerm(m.t);
  let c = 0;
  if (m.k === 'chow') c = 10;
  else if (m.k === 'pung') c = term ? 30 : 20;
  else if (m.k === 'kong') c = term ? 60 : 40;
  else if (m.k === 'pair') c = 5;
  const lv = ctx && ctx.lv ? (ctx.lv[m.k] || 0) : 0;
  return c + lv * (LV_CHIPS[m.k] || 0);
}
function tilePoints(x, ctx) {
  let p = rankOf(x.t) + (x.bonus || 0);
  const s = suitOf(x.t);
  if (ctx.suitBonus) p += ctx.suitBonus[s] || 0;
  if (s === 0 && ctx.has('yihong')) p += 3;
  if (s === 1 && ctx.has('xiaoxiang')) p += 3;
  if (s === 2 && ctx.has('hengwu')) p += 3;
  if (isTerm(x.t)) { if (ctx.has('liuye')) p += 5; if (ctx.termBonus) p += ctx.termBonus; }
  return p;
}

// score one meld at the moment it is laid out (banked). m: {k,t,src,tiles:[tile objects]}
function bankMeld(m, ctx) {
  const noTong = ctx.boss === 'xiajingui';
  const tilePops = m.tiles.map(x => (noTong && suitOf(x.t) === 2) ? 0 : tilePoints(x, ctx));
  const base = (noTong && suitOf(m.t) === 2) ? 0 : meldChips(m, ctx);
  const extras = [];
  if ((m.k === 'pung' || m.k === 'kong') && ctx.has('lengxiang')) extras.push({ id: 'lengxiang', add: 20 });
  if (m.src === 'peng' && ctx.has('zhulan')) extras.push({ id: 'zhulan', add: 30 });
  if (m.k === 'chow' && ctx.has('yanzhi')) extras.push({ id: 'yanzhi', add: 15 });
  if (m.src === 'self' && ctx.has('huaming') && ctx.ts && ctx.ts.huaming) extras.push({ id: 'huaming', add: ctx.ts.huaming });
  if (m.src && ctx.has('fenglu') && ctx.ts && ctx.ts.fenglu) extras.push({ id: 'fenglu', add: ctx.ts.fenglu });
  if (m.src && ctx.has('yaling') && ctx.ts && ctx.ts.yaling) extras.push({ id: 'yaling', add: ctx.ts.yaling });
  let sum = tilePops.reduce((a, b) => a + b, 0) + base + extras.reduce((a, e) => a + (e.add || 0), 0);
  if (m.k === 'kong' && ctx.has('queqiu')) { extras.push({ id: 'queqiu', mul: 3 }); sum *= 3; }
  if (m.src === 'chi' && ctx.has('yingge')) { extras.push({ id: 'yingge', mul: 2 }); sum *= 2; }
  if (m.src === 'self' && ctx.has('lvyudou')) { extras.push({ id: 'lvyudou', mul: 2 }); sum *= 2; }
  return { tilePops, base, extras, total: sum };
}

// ctx: { exposed:[{k,t,src,tiles,chips}], lastDraw, afterKong, ron, has(id), char, boss, suitBonus, xiangyunN }
function scoreDecomp(d, hand, ctx) {
  const exposed = ctx.exposed || [];
  const noTong = ctx.boss === 'xiajingui';
  const conc = d.seven ? [] : d.melds.map(m => ({ k: m.k, t: m.t, src: 'hand' }));
  const melds = d.seven ? [] : conc.concat(exposed.map(m => ({ k: m.k, t: m.t, src: m.src })));
  const allT = hand.map(x => x.t).concat(exposed.flatMap(m => meldTypes(m)));
  const suitsUsed = new Set(allT.map(suitOf));
  const open = exposed.some(m => m.src !== 'ankong');

  const fans = [];
  if (d.seven) fans.push('qidui');
  else {
    if (melds.every(m => m.k === 'chow')) fans.push('pinghu');
    if (melds.every(m => m.k !== 'chow')) fans.push('duidui');
    const hidden = melds.filter(m => (m.k === 'pung' && m.src === 'hand') || m.src === 'ankong').length;
    if (hidden >= 3) fans.push('sananke');
    for (let s = 0; s < 3; s++) {
      const starts = melds.filter(m => m.k === 'chow' && suitOf(m.t) === s).map(m => rankOf(m.t));
      if ([1, 4, 7].every(r => starts.includes(r))) { fans.push('yitiao'); break; }
    }
    for (let r = 1; r <= 7; r++) {
      if ([0, 1, 2].every(s => melds.some(m => m.k === 'chow' && m.t === s * 9 + r - 1))) { fans.push('sanse'); break; }
    }
  }
  if (allT.every(t => !isTerm(t))) fans.push('duanyao');
  if (!open) fans.push('menqing');
  if (ctx.lastDraw && !ctx.ron) fans.push('haidi');
  if (ctx.afterKong && !ctx.ron) fans.push('gangkai');
  if (suitsUsed.size === 1) fans.push('qingyise');
  if (suitsUsed.size === 1 && exposed.length === 0) {
    const c = countsOf(hand), s = suitOf(hand[0].t) * 9, base = [3, 1, 1, 1, 1, 1, 1, 1, 3];
    const extra = base.map((b, i) => c[s + i] - b);
    if (extra.every(e => e >= 0) && extra.reduce((a, b) => a + b, 0) === 1) fans.push('jiulian');
  }
  let fanVals = fans.map(id => {
    let v = FAN[id].fan;
    if (ctx.fanLv && ctx.fanLv[id]) v += ctx.fanLv[id];
    if (id === 'yitiao' && ctx.has('daguanyuan')) v *= 2;
    if (id === 'menqing' && ctx.char === 'baochai') v += 2;
    if (id === 'menqing' && ctx.has('meihua')) v += 3;
    if (id === 'duidui' && ctx.has('qilin')) v += 3;
    if (id === 'qingyise' && ctx.has('mudan')) v *= 2;
    return { id, v };
  });
  if (ctx.boss === 'jiazheng' && fanVals.length > 1) { fanVals.sort((a, b) => b.v - a.v); fanVals = fanVals.slice(0, 1); }

  // chips: banked + concealed groups (each with per-tile pops, for the settlement animation)
  const banked = exposed.reduce((a, m) => a + (m.chips || 0), 0);
  const pool = hand.slice();
  const take = t => { const i = pool.findIndex(x => x.t === t); return i >= 0 ? pool.splice(i, 1)[0] : { t, bonus: 0 }; };
  const groupsSrc = d.seven ? d.pairs.map(p => ({ k: 'pair', t: p })) : [{ k: 'pair', t: d.pair }].concat(d.melds);
  const concGroups = groupsSrc.map(g => {
    const tiles = meldTypes(g).map(take);
    const pops = tiles.map(x => (noTong && suitOf(x.t) === 2) ? 0 : tilePoints(x, ctx));
    const base = (noTong && suitOf(g.t) === 2) ? 0 : meldChips(g, ctx);
    const extras = [];
    if (g.k === 'pung' && ctx.has('lengxiang')) extras.push({ id: 'lengxiang', add: 20 });
    if (g.k === 'pung' && ctx.has('yuanyangjian')) extras.push({ id: 'yuanyangjian', add: 25 });
    if (g.k === 'chow' && ctx.has('yanzhi')) extras.push({ id: 'yanzhi', add: 15 });
    if (g.k === 'pair' && ctx.has('lingjiao') && !d.seven) extras.push({ id: 'lingjiao', add: 20 });
    const sum = pops.reduce((a, b) => a + b, 0) + base + extras.reduce((a, e) => a + e.add, 0);
    return { k: g.k, t: g.t, tiles: tiles.map(x => x.t), pops, base, extras, sum };
  });
  const concSum = concGroups.reduce((a, g) => a + g.sum, 0);
  const haitang = ctx.has('haitang') ? 15 * fanVals.length : 0;
  const gezi = ctx.has('gezi') ? 10 * (ctx.nTreasures || 0) : 0;
  const zmz = ctx.has('zimingzhong') ? 8 * (ctx.drawsLeft || 0) : 0;
  const bonusLines = [];
  const TS = ctx.ts || {};
  for (const [id, label] of [['jixue', '扫雪烹茶'], ['luohong', '落红成冢'], ['yanwo', '冰糖燕窝'], ['hongdou', '红豆曲'], ['shaoyao', '醉眠芍药裀']]) {
    if (ctx.has(id) && TS[id] > 0) bonusLines.push({ id, label, v: TS[id] });
  }
  if (haitang) bonusLines.push({ id: 'haitang', label: '海棠诗社', v: haitang });
  if (gezi) bonusLines.push({ id: 'gezi', label: '十锦槅子', v: gezi });
  if (zmz) bonusLines.push({ id: 'zimingzhong', label: '自鸣钟', v: zmz });
  const bonusChips = bonusLines.reduce((a, l) => a + l.v, 0);
  const chips = banked + concSum + bonusChips;
  const chipLines = [];
  if (exposed.length) chipLines.push({ label: '已亮面子', v: banked });
  chipLines.push({ label: '手中面子与牌点', v: concSum });
  bonusLines.forEach(l => chipLines.push(l));

  const zh = ctx.has('zanghun') ? Math.round((ctx.discN || 0) * 0.15 * 100) / 100 : 0;
  if (zh) fanVals.push({ id: 'zanghun', name: '冷月葬花魂', v: zh, extra: true });
  for (const [id, name] of [['shishe', '诗社社课'], ['qunfang', '群芳谱'], ['zhongqiu', '中秋联句'], ['sulao', '糖蒸酥酪'], ['sishan', '撕扇子'], ['xiangling', '香菱学诗']]) {
    if (ctx.has(id) && TS[id] > 0) fanVals.push({ id, name, v: TS[id], extra: true });
  }
  const baseFan = 1 + fanVals.reduce((a, f) => a + f.v, 0);
  let mult = 1;
  const multLines = [];
  if (ctx.has('fengyue')) { mult *= 2; multLines.push({ id: 'fengyue', label: '风月宝鉴', v: 2 }); }
  if (ctx.has('jinsuo')) { const v = ctx.has('baoyu') ? 3 : 1.5; mult *= v; multLines.push({ id: 'jinsuo', label: ctx.has('baoyu') ? '金锁 + 通灵宝玉' : '金锁', v }); }
  if (ctx.has('taixu')) { const n = fanVals.filter(f => !f.extra).length; if (n) { const v = Math.pow(1.2, n); mult *= v; multLines.push({ id: 'taixu', label: `太虚幻境 ×1.2^${n}`, v }); } }
  if (ctx.has('yeyan') && TS.yeyan > 0) { const v = Math.round((1 + 0.15 * TS.yeyan) * 100) / 100; mult *= v; multLines.push({ id: 'yeyan', label: `怡红夜宴 ×${v}`, v }); }
  if (ctx.has('shierchai') && TS.shierchai > 0) { const v = 1 + 0.5 * TS.shierchai; mult *= v; multLines.push({ id: 'shierchai', label: `金陵十二钗册 ×${v}`, v }); }
  if (ctx.has('fengao') && TS.fengao > 0) { const v = Math.round((1 + 0.1 * TS.fengao) * 100) / 100; mult *= v; multLines.push({ id: 'fengao', label: `焚稿 ×${v}`, v }); }
  if (ctx.has('tidui') && TS.tidui > 0) { const v = Math.round((1 + 0.2 * TS.tidui) * 100) / 100; mult *= v; multLines.push({ id: 'tidui', label: `题对额 ×${v}`, v }); }
  if (ctx.has('fengguan') && ctx.bossMatch) { mult *= 2; multLines.push({ id: 'fengguan', label: '凤冠（坐庄局）', v: 2 }); }
  if (ctx.char === 'xiangyun' && ctx.xiangyunN > 0) {
    const m = Math.pow(1.1, ctx.xiangyunN); mult *= m; multLines.push({ id: 'xiangyun', label: `醉眠 ×1.1^${ctx.xiangyunN}`, v: m });
  }
  const finalFan = Math.round(baseFan * mult * 100) / 100;
  let total = Math.round(chips * finalFan);
  let note = '';
  if (ctx.boss === 'jiamu' && finalFan < 3) { total = banked; note = '贾母：最终番低于 3，只按已亮的分算'; }
  return { total, chips, banked, concGroups, chipLines, haitang: bonusChips, bonusLines, fans: fanVals.map(f => f.extra ? { id: f.id, name: f.name, fan: f.v, v: f.v, desc: '', extra: true } : ({ ...FAN[f.id], v: f.v })), baseFan, multLines, finalFan, note,
    exposed: exposed.map(m => ({ k: m.k, t: m.t, src: m.src, chips: m.chips })) };
}

function bestScore(hand, ctx) {
  const ds = decompositions(hand, (ctx.exposed || []).length);
  let best = null;
  for (const d of ds) {
    const r = scoreDecomp(d, hand, ctx);
    if (!best || r.total > best.total || (r.total === best.total && r.finalFan > best.finalFan)) best = r;
  }
  return best;
}

function waits(hand, ctx, seenCounts) {
  const res = [];
  const n = (ctx.exposed || []).length;
  for (let t = 0; t < 27; t++) {
    const used = seenCounts[t];
    if (used >= 4) continue;
    const h = hand.concat([{ t, bonus: 0, id: -1 }]);
    if (!isWin(h, n)) continue;
    const r = bestScore(h, ctx);
    res.push({ t, left: 4 - used, score: r.total });
  }
  return res;
}

const shMemo = new Map();
function shanten(c, melds) {
  const key = c.join('') + '|' + melds;
  if (shMemo.has(key)) return shMemo.get(key);
  let best = 8;
  const need = 4 - melds;
  function rec(i, m, t, pair) {
    while (i < 27 && c[i] === 0) i++;
    if (i >= 27) {
      const mm = Math.min(m, need);
      const tt = Math.min(t, need - mm);
      const s = 2 * (need - mm) - tt - (pair ? 1 : 0);
      if (s < best) best = s;
      return;
    }
    if (c[i] >= 3) { c[i] -= 3; rec(i, m + 1, t, pair); c[i] += 3; }
    if (rankOf(i) <= 7 && c[i + 1] && c[i + 2]) { c[i]--; c[i + 1]--; c[i + 2]--; rec(i, m + 1, t, pair); c[i]++; c[i + 1]++; c[i + 2]++; }
    if (c[i] >= 2 && !pair) { c[i] -= 2; rec(i, m, t, true); c[i] += 2; }
    if (c[i] >= 2) { c[i] -= 2; rec(i, m, t + 1, pair); c[i] += 2; }
    if (rankOf(i) <= 8 && c[i + 1]) { c[i]--; c[i + 1]--; rec(i, m, t + 1, pair); c[i]++; c[i + 1]++; }

  if (melds === 0) {

// ================= run flow =================
function newRun(charId) {
  const pool = BOSSES.map(b => b.id), bosses = [];
  for (let r = 0; r < ROUNDS - 1; r++) {
    let b; do { b = pool[rnd(pool.length)]; } while (bosses.length && bosses[bosses.length - 1] === b);
    bosses.push(b);
  }
  bosses.push('jiamu');
  G = { v: 2, screen: 'match', char: charId, round: 1, idx: 0, money: 4, lamps: LAMPS, treasures: [], bosses, fate: 0,
    ts: {}, lv: { chow: 0, pung: 0, kong: 0, pair: 0 }, fanLv: {}, cons: [], seenFans: [], shopCons: [],
    stats: { won: 0, lost: 0, best: null, total: 0 }, m: null, shop: null, reroll: 2, last: null, pending: null };
  startMatch();
}

function startMatch() {
  const kind = KINDS[G.idx];
  const boss = kind.id === 'boss' ? G.bosses[G.round - 1] : null;
  if (G.char === 'xifeng') G.money += 2;
  if (has('yueqian')) G.money += 2;
  const draws = BASE_DRAWS - (has('fengyue') ? 3 : 0) + (has('doupeng') ? 1 : 0);
  let swaps = BASE_SWAPS + (has('fengzheng') ? 1 : 0);
  if (G.char === 'daiyu' || boss === 'xuepan') swaps = 0;
  const wall = shuffle(Array.from({ length: 108 }, (_, i) => ({ t: Math.floor(i / 4), id: i, bonus: 0 })));
  const start = has('baoyu') ? 14 : 13;
  const hand = sortHand(wall.splice(0, start));
  const duel = boss ? { hand: sortHand(wall.splice(0, 13)), melds: [], score: 0, tenpai: false, p: Math.max(0.05, 0.4 - 0.07 * (G.round - 1)), log: [] } : null;
  G.m = { duel, kind: kind.id, boss, target: targetFor(G.round, G.idx), wall, hand, exposed: [], banked: 0, river: [], npcRivers: [[], [], []],
    drawsLeft: draws, drawsMax: draws, swapsLeft: swaps, swapsMax: swaps, phase: start === 14 ? 'discard' : 'draw',
    call: null, npcNext: 0, turnSeat: null, lastNpc: null, afterKong: false, declined: false, xyN: 0,
    suitBonus: [0, 0, 0], nextBonus: 0, newId: null, pengN: 0, discSuit: [0, 0, 0], termBonus: 0 };
  G.screen = 'match'; G.pending = null;
  Object.assign(ui, { sel: null, swapSel: [], swapMode: false, intro: false, settle: null, bankShown: null, fresh: null, useCons: null });
  save();
  act(async () => {
    await opening();
    if (boss) { ui.intro = true; render(); SFX.thud(); return; }
    say('start');
    if (G.m.phase === 'draw') await drawStep();
  });
}

function takeFromWall() {
  const m = G.m;
  const x = m.wall.shift();
  x.hidden = m.boss === 'zhao' && Math.random() < 0.2;
  if (m.nextBonus) { x.bonus = (x.bonus || 0) + m.nextBonus; m.nextBonus = 0; }
  m.hand.push(x); sortHand(m.hand); m.newId = x.id;
  return x;
}
function takeTypes(ts) {
  const m = G.m, out = [];
  for (const t of ts) { const i = m.hand.findIndex(y => y.t === t && !y.hidden); out.push(m.hand.splice(i, 1)[0]); }
  return out;
}
const visibleHand = () => G.m.hand.filter(x => !x.hidden);
const hasHidden = () => G.m.hand.some(x => x.hidden);

// 剩 3 巡、最后 1 巡各提醒一次
function lowDrawWarn() {
  const m = G && G.m; if (!m || m.phase === 'over') return;
  m.warned = m.warned || {};
  const n = m.drawsLeft;
  if (n <= 2 && n >= 0 && !m.warned[n]) {
    m.warned[n] = true; save();
    const gap = m.target - m.banked;
    const name = ['最后一巡', '倒数第二巡', '倒数第三巡'][n];
    const after = ['这张打完就结束', '打完这张，还剩最后一巡', '打完这张，还剩两巡'][n];
    stamp(name, 'red');
    const duelTxt = m.duel ? `　庄家 ${m.duel.score} 分${m.duel.tenpai ? '，已听牌，小心点炮' : ''}。` : '';
    setTimeout(() => toast(`${name} · ${after}`,
      (gap <= 0 ? '已亮的分够过关了，可以“收手”。' : `已亮 ${m.banked}，离目标还差 ${gap}。能胡就胡，能亮就亮。`) + duelTxt), 500);
    SFX.buzz();
  }
}
async function drawStep() {
  const m = G.m;
  if (m.drawsLeft <= 0 || !m.wall.length) return endMatch('drawout');
  m.drawsLeft--;
  if (m.declined && G.char === 'xiangyun') m.xyN++;
  const x = takeFromWall();
  m.phase = 'discard'; m.turnSeat = null;
  ui.justDrew = x.id; save(); render(); ui.justDrew = null;
  SFX.clack(); grow('shaoyao', 3); save(); lowDrawWarn();
  if (x.hidden) { await sleep(200); popAt(app.querySelector('.hand .new'), '赵姨娘遮住了', 'red'); }
}

function canWinNow() { const m = G.m; return m.phase === 'discard' && !hasHidden() && isWin(m.hand, m.exposed.length); }
function liangOptions() {
  const m = G.m; if (m.phase !== 'discard' || m.exposed.length >= 4) return [];
  return meldOptions(visibleHand());
}
function kongOptions() {
  const m = G.m; if (m.phase !== 'discard' || !m.wall.length) return [];
  const c = countsOf(visibleHand()), out = [];
  c.forEach((n, t) => { if (n === 4) out.push({ type: 'an', t }); });
  m.exposed.forEach((g, mi) => { if (g.k === 'pung' && c[g.t] >= 1) out.push({ type: 'bu', t: g.t, mi }); });
  return out;
}
function callOptions(x, s) {
  const m = G.m, c = countsOf(visibleHand());
  const o = { hu: false, peng: false, chi: [] };
  if (!hasHidden() && isWin(m.hand.concat([x]), m.exposed.length)) o.hu = true;
  if (m.drawsLeft > 0 && m.exposed.length < 4) {
    if (c[x.t] >= 2) o.peng = true;
    if (s === 2) for (const st of [x.t - 2, x.t - 1, x.t]) {
      if (st < 0 || suitOf(st) !== suitOf(x.t) || rankOf(st) > 7) continue;
      const need = [st, st + 1, st + 2].filter(t => t !== x.t);
      if (need.every(t => c[t] > 0)) o.chi.push(st);
    }
  }
  return (o.hu || o.peng || o.chi.length) ? o : null;
}

// bank a meld (亮 / 吃 / 碰 / 杠) with per-tile pops
async function bank(meld, label, mi = null) {
  const m = G.m;
  const r = bankMeld(meld, ctx());
  const old = mi == null ? 0 : m.exposed[mi].chips;
  meld.chips = r.total;
  if (mi == null) { m.exposed.push(meld); mi = m.exposed.length - 1; } else m.exposed[mi] = meld;
  const before = m.banked;
  m.banked = m.exposed.reduce((a, g) => a + g.chips, 0);
  ui.bankShown = before; ui.fresh = mi; ui.sel = null; ui.swapMode = false;
  save(); render();
  stamp(label);
  await sleep(380);
  const g = app.querySelector(`.meld[data-mi="${mi}"]`);
  const tiles = g ? [...g.querySelectorAll('.tile')] : [];
  const lab = g && g.querySelector('.mc');
  const base0 = before - old; let run = 0;
  const upd = () => { setBankShown(base0 + run); if (lab) { lab.textContent = '+' + run; jig(lab); } };
  for (let i = 0; i < tiles.length; i++) {
    const p = r.tilePops[i] || 0; run += p;
    jig(tiles[i]); popAt(tiles[i], '+' + p); SFX.tick(i); upd();
    await sleep(160);
  }
  if (r.base) { run += r.base; popAt(g, `+${r.base} ${MELDNAME[meld.k]}`, 'gold'); SFX.tick(tiles.length + 2); upd(); await sleep(260); }
  for (const e of r.extras) {
    const slot = app.querySelector(`.slot[data-id="${e.id}"]`); jig(slot);
    if (e.add) { run += e.add; popAt(slot || g, '+' + e.add, 'gold'); SFX.tick(9); }
    else { run *= e.mul; popAt(slot || g, '×' + e.mul, 'red'); SFX.mult(); }
    upd(); await sleep(320);
  }
  run = r.total; upd();
  onBank();
  if (before < m.target && m.banked >= m.target) {
    await sleep(160); stamp('够了！', 'gold'); SFX.chime(); bigShake(); await sleep(600);
  }
  ui.bankShown = null; ui.fresh = null;
  save(); render();
}
function setBankShown(v) {
  const m = G.m;
  const el = document.getElementById('bankv'); if (el) el.textContent = v;
  const bar = document.querySelector('.goal .bar i'); if (bar) bar.style.width = Math.min(100, v / m.target * 100) + '%';
  const goal = document.querySelector('.goal'); if (goal) goal.classList.toggle('full', v >= m.target);
}

async function doDiscard(id) {
  const m = G.m;
  if (m.phase !== 'discard') return;
  const i = m.hand.findIndex(x => x.id === id);
  if (i < 0) return;
  const fromEl = app.querySelector(`.hand [data-id="${id}"]`);
  const fromRect = fromEl && fromEl.getBoundingClientRect();
  if (canWinNow()) m.declined = true;
  const [x] = m.hand.splice(i, 1);
  x.hidden = false;
  const flipped = m.hand.filter(y => y.hidden).map(y => y.id);
  m.hand.forEach(y => { y.hidden = false; });
  m.river.push(x);
  m.discSuit[suitOf(x.t)]++;
  if (G.char === 'daiyu') { m.suitBonus[suitOf(x.t)]++; if (m.discSuit[suitOf(x.t)] >= 9) ach('zanghua'); }
  if (has('huachu')) m.nextBonus += 2;
  if (has('furong') && isTerm(x.t)) m.termBonus = (m.termBonus || 0) + 2;
  m._grow = [['luohong', 1], ['fengao', 1]].concat(isTerm(x.t) ? [['fenglu', 1]] : []);
  m.afterKong = false; m.newId = null; ui.sel = null; ui.swapMode = false;
  m.phase = 'npc'; m.npcNext = 0;
  ui.flipIds = flipped.length ? flipped : null;
  save(); render(); ui.flipIds = null;
  const toEl = app.querySelector('.ps.p3 .tile:last-child');
  await fly(fromRect, toEl, 230);
  SFX.clack();
  if (G.char === 'daiyu' && toEl) popAt(toEl, `葬花 ${SUITS[suitOf(x.t)]}+1`, 'gold');
  (m._grow || []).forEach(([id, d]) => grow(id, d)); m._grow = null; save();
  if (m.duel) {
    const r = await bossReact(x);
    if (r === 'hu') return;
    if (r === 'peng') { if (m.drawsLeft <= 0) { await sleep(300); return endMatch('drawout'); } return npcRound(2); }
  }
  if (m.drawsLeft <= 0) { await sleep(300); return endMatch('drawout'); }
  await npcRound(0);
}

function finish(res, won) {

    lines.push({ label: `过关奖励（${kind.name}）`, v: kind.reward });

    const extra = Math.floor(m.drawsLeft / 4);
    if (extra) lines.push({ label: `剩余 ${m.drawsLeft} 巡（每 4 巡 $1）`, v: extra });
  }
  if (won && has('pangxie')) lines.push({ label: '螃蟹宴', v: 5 });
  if (res.cash && pass && has('jiuling')) lines.push({ label: '酒令签', v: 3 });
  if (has('jinku')) lines.push({ label: '荣府银库', v: 4 });
  if (has('liulao') && G.ts.liulao) lines.push({ label: '刘姥姥的荷包', v: G.ts.liulao });
  const it = interest();
  if (it) lines.push({ label: `利息（每 $5 得 $1，上限 $${interestCap()}）`, v: it });
  const gain = lines.reduce((a, l) => a + l.v, 0);
  G.money += gain;
  let saved = false;

  else { G.stats.lost++; G.lamps--; }
  G.stats.total += res.total;
  if (won && (!G.stats.best || res.total > G.stats.best.total)) G.stats.best = { total: res.total, fans: (res.fans || []).map(f => f.name) };
  // hidden achievements
  if (won) {
    if (has('jinsuo') && has('baoyu')) ach('jinyu');
    const ids = (res.fans || []).map(f => f.id);
    if (ids.includes('yitiao')) ach('haitang');
    if (ids.includes('jiulian')) ach('jiulian');
    if (ids.length >= 4) ach('yeyan');
  }
  if (res.cash && pass) ach('shoushou');
  // growth treasures update AFTER this hand was scored
  const growth = [];
  const g = (id, nv) => { if (!has(id)) return; const ov = G.ts[id] || 0; if (nv !== ov) { G.ts[id] = nv; growth.push(`${TREASURE[id].name}：${ov} → ${nv}`); } };
  const fanIds = (res.fans || []).filter(f => !f.extra).map(f => f.id);
  if (won) {
    g('shishe', fanIds.includes('menqing') ? (G.ts.shishe || 0) + 1 : (G.ts.shishe || 0));
    g('zhongqiu', (G.ts.zhongqiu || 0) + 1);
    const fresh = fanIds.filter(id => !(G.seenFans || []).includes(id));
    G.seenFans = (G.seenFans || []).concat(fresh);
    if (fresh.length) g('qunfang', (G.ts.qunfang || 0) + fresh.length);
    g('yeyan', (G.ts.yeyan || 0) + 1);
    g('fengao', 0);
  } else { g('shishe', 0); g('zhongqiu', 0); g('shaoyao', 0); }
  if (pass) g('yaling', (G.ts.yaling || 0) + 4);
  if (has('dangpiao')) g('dangpiao', (G.ts.dangpiao || 0) + 2);
  if (has('sulao')) {
    const nv = (G.ts.sulao || 0) - 1;
    if (nv <= 0) { G.treasures = G.treasures.filter(x => x !== 'sulao'); growth.push('糖蒸酥酪吃完了'); }
    else g('sulao', nv);
  }
  if (res.cash && pass) g('liulao', (G.ts.liulao || 0) + 1);
  if (m.kind === 'boss' && pass) g('shierchai', (G.ts.shierchai || 0) + 1);
  if (has('yanwo')) {
    const nv = (G.ts.yanwo || 0) - 10;
    if (nv <= 0) { G.treasures = G.treasures.filter(x => x !== 'yanwo'); growth.push('冰糖燕窝吃完了，碗也撤了'); }
    else g('yanwo', nv);
  }
  if (res.total >= m.target * 3) ach('fanbei');
  const sayKind = !pass ? 'fail' : (m.kind === 'boss' ? 'boss' : 'pass');
  G.last = { sayKind, sayText: lineFor(sayKind), res, pass, won, lines, gain, target: m.target, kind: m.kind, boss: m.boss, round: G.round, idx: G.idx, lostLamp: !pass && !saved, saved, growth, duel: m.duel ? m.duel.score : null };
  G.pending = null; ui.settle = null;

}
function afterResult() {
  const L = G.last;
